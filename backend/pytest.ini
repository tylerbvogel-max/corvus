[pytest]
testpaths = tests
addopts = --strict-config --strict-markers
asyncio_mode = strict
timeout = 30
timeout_method = signal
faulthandler_timeout = 20
markers =
    hermetic: deterministic tests with no database, network, provider, or subprocess dependency
    database: tests requiring a disposable PostgreSQL database named corvus_test_* or corvus_migration_*
    integration: in-process component or tenant-boundary tests with all external I/O replaced
    evaluation: expensive or benchmark-oriented deterministic checks; opt-in outside the PR gate
    live_provider: real model-provider round trips; requires --run-live-provider and explicit provider configuration
    snapshot: database migration test requiring CORVUS_TEST_SNAPSHOT_DUMP
