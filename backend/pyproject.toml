[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corvus-backend"
version = "0.1.0"
description = "Corvus multi-tenant neuron graph backend"
readme = "../README.md"
license = { text = "MIT" }

# One supported runtime range, deliberately narrow: 3.11 is the only interpreter
# any supported environment actually runs. Local is 3.11.2, CI pins 3.11, and the
# container is python:3.11-slim. Widening this is a decision to be made with a
# test lane behind it, not an aspiration expressed as a range.
requires-python = ">=3.11,<3.12"

# THIS LIST IS THE DEPENDENCY AUTHORITY.
#
# Every entry below is directly imported by source, or is a process entry point
# the application shells into. requirements.txt is a GENERATED, fully-pinned,
# hash-verified lock compiled from this list — never hand-edit it. To change a
# dependency: edit this list, then run `python scripts/lock_dependencies.py`.
#
# Transitive packages that used to be hand-listed in requirements.txt are not
# repeated here. In particular click / h11 / httptools / uvloop / watchfiles /
# websockets / python-dotenv are precisely the `uvicorn[standard]` extra set;
# they were flattened in by a historical `pip freeze` and are now expressed by
# the extra that actually requires them.
dependencies = [
    # Database and migrations
    "alembic>=1.18.0",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.11",
    "SQLAlchemy==2.0.47",

    # Web application and settings
    # starlette 1.3.1 clears PYSEC-2026-161, -2280, -2281, -248 and -249; nothing
    # below 1.3.1 clears all five.
    #
    # fastapi did not move with starlette on 2026-08-03 and moves on its own
    # here, because 0.138.0 changed what include_router() leaves in app.routes:
    # one opaque _IncludedRouter per include instead of the included router's
    # routes flattened in. Requests route identically through it — what moved is
    # introspection, and Corvus decides capability ownership by introspection,
    # so against the wrapper every capability read as owning nothing.
    #
    # Route enumeration now goes through scripts.capability_snapshot.
    # effective_routes, which resolves the wrapper via fastapi's own public
    # iter_route_contexts — the helper its OpenAPI generator uses. The proof it
    # re-describes rather than redefines: all six recorded composition artifacts
    # came out byte-identical on 0.135.1 and 0.141.1.
    #
    # 0.138.0 is therefore a hard floor, not a preference: below it that helper
    # does not exist and the accessor raises at import rather than degrading to
    # a read that would report every capability owning nothing. Downgrading
    # fastapi means restoring a fallback, not just moving this pin.
    # See deps-fastapi-included-router.
    #
    # Note fastapi still does not cap starlette (bare starlette>=0.46.0), so the
    # 1.x pin below remains ours to hold rather than something fastapi enforces.
    "fastapi==0.141.1",
    "starlette==1.3.1",
    "uvicorn[standard]==0.41.0",
    "pydantic==2.12.5",
    # 2.14.2 clears GHSA-4xgf-cpjx-pc3j.
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",

    # Numerics and embeddings.
    # scipy is imported directly at backend/app/routers/performance.py:10 but was
    # absent from requirements.txt; it only resolved as an accidental transitive
    # of sentence-transformers. Declared explicitly so the import cannot break
    # when that upstream chain changes.
    "numpy==2.4.2",
    "scipy>=1.11,<2",
    "sentence-transformers==5.2.3",

    # Graph community detection
    "python-igraph>=0.11.0",
    "leidenalg>=0.10.0",

    # Agent harness surface.
    # 1.28.1 clears PYSEC-2026-3481/3482 (fix 1.27.2) and PYSEC-2026-3483
    # (fix 1.28.1). Held below 1.29/2.x deliberately: this is a security bump
    # verified against the two transports Corvus actually uses (the stdio
    # harness bridge and the streamable-http session manager at /mcp), not a
    # move to the newest major.
    "mcp==1.28.1",

    # LLM provider SDKs that are actually imported. The Anthropic path is
    # deliberately absent: it routes through the Claude CLI subprocess in
    # llm_provider.py, never the SDK. See docs/SUPPLY-CHAIN.md.
    "google-genai>=1.0.0",
    "groq>=0.15.0",
    "openai>=1.40.0",

    # Auth. The [crypto] extra is what pulls `cryptography`, which was previously
    # listed bare with no importer of its own.
    "PyJWT[crypto]>=2.8.0",

    # Document ingest
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "PyMuPDF>=1.24.0",

    # Configuration parsing
    "PyYAML==6.0.3",

    # SECURITY FLOORS, not direct dependencies. Nothing here is imported by
    # app code; each is a transitive package carrying an advisory that the
    # resolver would otherwise keep pinned at the vulnerable version, because
    # uv treats the committed lock as resolution preferences. Declaring a floor
    # is the only way to move a transitive pin without unpinning everything.
    # Remove an entry once the parent package requires the fixed version on its
    # own — leaving it costs nothing but noise, keeping it wrong costs a CVE.
    "idna>=3.15",        # PYSEC-2026-215
    "pygments>=2.20.0",  # PYSEC-2026-2987
]

[project.optional-dependencies]
test = [
    # 9.0.3 clears PYSEC-2026-1845.
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-timeout==2.4.0",
]

[tool.setuptools]
packages = ["app"]
