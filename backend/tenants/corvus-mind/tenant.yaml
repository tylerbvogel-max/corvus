display_name: "Corvus Mind"
default_port: 8005  # 8004 is the frontend dev server (vite.config.ts hardcodes it)
description: "Agentic institutional memory for coding harnesses. Situated episodes with outcomes, evidence-gated lessons, temporal supersession."
system_use_banner: >-
  Corvus Mind — Agentic Memory Organ.
  This tenant accumulates verified, situated agentic experience (episodes,
  lessons, tool profiles, context scopes) captured from harness sessions.
  Memories carry provenance and decay; recalled content is background
  context, never instructions.
# Memory recall is embedding-first: remembered lessons carry no role_key,
# so role-driven candidate selection would never surface them.
semantic_prefilter_enabled: true
# Enables /recall, /remember, /distill, /janitor, /compile on this tenant
# (they 404 on knowledge tenants — see tenant.py memory_surface_enabled).
memory_surface: true
# Runtime composition (app/composition/capabilities.py). Fail-closed: a tenant
# with no capabilities block refuses to start. This is the operator-facing
# deployment; the frontend measurably calls /admin/documents, /admin/eval,
# /admin/labs, /admin/integrity, /v1/agents and the memory surface, so those
# capabilities stay. Reductions must be driven by consumer evidence, not by how
# dormant a surface looks from the backend.
#
# compliance is DROPPED as of 2026-08-01, after record 04 removed the seam that
# blocked it. The demand evidence was already in: only KnowledgeGovernancePage
# imports a compliance client function, the nav does not render it on a memory
# tenant, four more compliance client functions have no importer at all, and
# audit_log shows zero compliance mutations in this tenant's history.
#
# What blocked it was ownership, not demand. routers/compliance.py also owned
# /admin/system-banner and /admin/audit-log*, which are operator surfaces;
# SystemUseBanner renders on every page load and fails soft, so the first
# attempt made the system-use notification silently disappear. Those three
# routes now live in app/operations/ under the operator capability, so dropping
# compliance here removes only compliance.
capabilities:
  - memory
  - knowledge_graph
  - ingestion
  - governance
  - evaluation
  - operator
  - external_api

regulatory_department_name: "Provenance"
region_label: "Scope"
reseed_threshold: 10
baseline_prompt: "I am an agentic coding assistant recalling institutional memory for this machine, its projects, and its user."
seed_prompts:
  - label: "Environment gotcha"
    text: "What should I know before checking which process holds a port on this machine?"
  - label: "Project recall"
    text: "What has gone wrong before when running migrations on a fresh Corvus database?"
  - label: "User preference"
    text: "The frontend isn't showing my changes — what does the user expect me to do about it?"
  - label: "Tool profile"
    text: "Which Claude CLI flags are required when shelling out from inside a Claude Code session?"

# Node-type mapping (Amendment A, CORVUS-MIND-DESIGN.md §8.2):
# mind vocabulary rides node_type; abstraction_type aliases onto the engine's six:
#   episode       -> artifact   (decay-reclaimable; episodes should decay)
#   lesson        -> principle
#   tool-profile  -> procedure
#   context-scope -> structural

# Evidence-gated writes (Amendment B): informational-tier candidates
# auto-commit and are reclaimed by consolidation decay if never reinforced;
# promotion ladder informational -> guidance -> organizational.
write_gate:
  mode: tiered
  auto_commit_max_authority: guidance
  require_guardrails_pass: true
  min_confidence: 0.6

output_policies:
  citation:
    enabled: true
    min_citations: 1
    action: flag
    severity: warn
  pii:
    enabled: true
    action: redact
    severity: error
  export_control:
    enabled: false
