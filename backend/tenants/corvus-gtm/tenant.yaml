display_name: "Corvus GTM"
default_port: 8006
description: "Go-to-market knowledge library: positioning, pricing, distribution, and negotiation from open business-school courseware and operator essays."
system_use_banner: >-
  Corvus GTM — Go-to-Market Knowledge Library.
  Reference corpus of positioning, pricing, distribution, sales-motion,
  and negotiation knowledge drawn from open courseware (MIT OCW), operator
  essay archives (YC, First Round, Paul Graham), and applied outcomes.
  Reference-only; does not replace professional judgment.
semantic_prefilter_enabled: false
regulatory_department_name: "Sources"
reseed_threshold: 40
baseline_prompt: "I am a technical builder commercializing a platform product and managing my own position in the career market."
seed_prompts:
  - label: "Positioning"
    text: "How do I position a domain-agnostic platform against established incumbents without competing on their terms?"
  - label: "Pricing"
    text: "How should a B2B developer-facing product be priced for mid-market accessibility?"
  - label: "First customers"
    text: "How do I land the first ten customers for a technical product with no sales team?"
  - label: "Negotiation"
    text: "How do I negotiate compensation when I hold a strong competing offer?"
  - label: "Career positioning"
    text: "How do I translate a deep technical portfolio into the language hiring managers value?"

# Output policy gates: citation + PII guards active; no export-control
# surface for open business education content.
output_policies:
  citation:
    enabled: true
    min_citations: 1
    action: flag
    severity: warn
  pii:
    enabled: true
    action: redact
    severity: error
  export_control:
    enabled: false
