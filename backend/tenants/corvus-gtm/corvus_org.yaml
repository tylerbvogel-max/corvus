# Corvus GTM — Go-to-Market Knowledge Scaffold
# Regions are the silo tags for commercial knowledge:
#   Positioning / Pricing & Packaging / Sales & Distribution / Negotiation /
#   Career Market (+ Sources, force-seeded as the citation-authority department
#   from tenant.yaml). Structural nodes only — knowledge arrives via document
#   ingest -> extraction -> placement -> approval, never from this file.

departments:

  - label: Positioning
    roles:
      - label: Positioning Strategist
        role_key: positioning_strategist
        tasks:
          - label: Set the context that makes strengths obvious
            summary: Segmentation, differentiation, competitive alternatives, and category design
            content: |
              Positioning work answers five questions in order: what would the buyer use
              if we didn't exist, what do we have that the alternatives don't, what value
              does that enable and what proves it, who cares about that value the most,
              and what category makes all of it legible. The corpus here carries the
              doctrine (Dunford, category design, segmentation courseware); applied
              outcomes on Corvus and the career market are the highest-authority layer.

  - label: Pricing & Packaging
    roles:
      - label: Pricing Strategist
        role_key: pricing_strategist
        tasks:
          - label: Discover price from value and alternatives
            summary: Value metrics, willingness-to-pay, tiering, and packaging structure
            content: |
              Pricing knowledge in this region covers value-metric selection (what unit
              scales with customer success), willingness-to-pay discovery, tier and
              packaging design, and the chronic technical-founder failure mode of
              underpricing. Mid-market accessibility is a standing constraint for the
              Corvus product thesis — packaging, not just discounting.

  - label: Sales & Distribution
    roles:
      - label: Distribution Operator
        role_key: distribution_operator
        tasks:
          - label: Match the motion to the product
            summary: Channels, first customers, product-led growth, and sales motions by stage
            content: |
              Distribution knowledge is stage-dependent: first-ten-customers work is
              manual and founder-led by design; scalable motions (self-serve, PLG,
              inside sales, channel) attach later and must match the price point.
              This region holds the operator playbooks — YC library, First Round,
              PG's do-things-that-don't-scale doctrine — and their applied results.

  - label: Negotiation
    roles:
      - label: Negotiator
        role_key: negotiator
        tasks:
          - label: Negotiate from alternatives, not arguments
            summary: BATNA, anchoring, interests versus positions, compensation negotiation
            content: |
              Negotiation doctrine: power lives in the best alternative to a negotiated
              agreement, anchors set ranges, interests beat positions, and first offers
              in negotiable markets are invitations. Applied focus: compensation
              negotiation for the career track and eventual customer/contract
              negotiation for the product track.

  - label: Career Market
    roles:
      - label: Career Strategist
        role_key: career_strategist
        tasks:
          - label: Position the person as the product
            summary: Translating a technical portfolio into market value hiring managers recognize
            content: |
              The career market is a GTM problem where the product is the person:
              positioning against the hiring manager's alternatives, evidence of value
              (portfolio, measurable outcomes), and the language of the target market's
              job postings. Standing target: Databricks-direction data-platform roles;
              standing evidence base: Corvus, Corvus-Mind, and the portfolio of shipped
              systems. Market-signal data (postings, comp points) belongs here.
