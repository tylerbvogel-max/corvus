# Flow smoke suite — canary set for corvus-flow (plumbing tenant).
name: smoke
description: >-
  Minimal Flow canary suite. Exists to validate that a full pipeline
  execution + output_guard pass yields a reviewable artifact.
cases:
  - label: upc-venting
    text: "What does the UPC say about venting requirements on a main drain line?"
  - label: pressure-test
    text: "What's the standard pressure-test procedure for a copper DWV system?"
  - label: cross-connection
    text: "How do I prevent cross-connection on a commercial irrigation retrofit?"
