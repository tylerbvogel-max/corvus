# Aero smoke suite — small canary set (~5 queries).
# Deliberately covers the three departments Aero cares about most
# (regulatory, quality, program mgmt) plus one export-control probe
# that should exercise Pattern #7 guards without tripping block.
name: smoke
description: >-
  Minimal Aero canary suite. Exists to validate that a full pipeline
  execution + output_guard pass yields a reviewable artifact. Not a
  quality harness — small by design.
cases:
  - label: far-fixed-price
    text: "What FAR clauses apply to a fixed-price development contract with a government customer?"
  - label: as9100-surveillance
    text: "How should I prepare for an AS9100D Stage 2 surveillance audit?"
  - label: itar-subcontract
    text: "We're shipping technical data to a UK subcontractor. What ITAR requirements apply?"
  - label: root-cause
    text: "A machined part failed dimensional inspection. Walk me through the root cause analysis process."
  - label: dcaa-cost
    text: "What does DCAA look for when auditing an incurred cost submission?"
