  - id: full-query-answer
    name: Run a graph-grounded answer
    availability: executable-historical-and-external
    trigger: POST /query, /query/stream, /v1/query, or the legacy Corvus MCP query_graph tool
    cadence: On demand; Query Lab is hidden on the current memory-surface nav but the APIs remain live
    why: Produce and compare model answers grounded in graph context with deterministic citation and output controls.
    outcome: Query, slots, telemetry, costs, firings, citation audit, and response are persisted; streaming callers see each stage.
    through: [query-delivery, recall-graph, platform-infra, provenance-compliance]
    steps:
      - actor: query router
        component: query-delivery
        does: Validate request, run deterministic input guard, normalize model slots, and invoke execute_query.
        state_change: None before the executor creates a Query row.
        guardrail: Blocked input returns 403; stage failures name the failed stage.
        evidence:
          - backend/app/routers/query.py::post_query
      - actor: context pipeline
        component: query-delivery
        does: Run ordered cheap prep; reuse persisted-session context only when fresh-pack overlap crosses the drift gate.
        state_change: No durable write; the actual primary prompt and slot contract are held in a transient Query object.
        guardrail: Raw comparison slots receive no neuron context; A/B slots are not silently tier-swapped.
        evidence:
          - backend/app/services/executor.py::_acquire_query_contexts
          - backend/app/services/executor.py::execute_query
      - actor: database phase boundary
        component: platform-infra
        does: Commit the completed graph-read phase and return its pooled PostgreSQL connection before any answer, citation-repair, or judge model can wait.
        state_change: The read transaction ends; loaded context remains in memory and no Query row is durable yet.
        guardrail: Provider-slot helpers receive no AsyncSession; the next database operation starts a fresh persistence transaction.
        evidence:
          - backend/app/database.py::release_connection_before_external_io
      - actor: provider slots
        component: query-delivery
        does: Execute one or more neuron/raw slots concurrently, apply primary effort/model floors and optional tier escalation, and preserve per-slot usage.
        state_change: Slot results accumulate in memory before final persistence.
        guardrail: Provider alias fallback is explicit; persisted-session state applies only to primary slot; no database handle enters the slot.
        evidence:
          - backend/app/services/executor.py::_execute_slot
          - backend/app/services/llm_provider.py
      - actor: citation/output guards
        component: query-delivery
        does: Verify per-query random citation keys, strip/repair fabricated keys, score claim/source relevance, escalate the ambiguous band to entailment, and run tenant output policies.
        state_change: Pre-persistence citation artifacts accumulate in memory; CitationHopSession and OutputViolation rows persist only after provider work.
        guardrail: Valid-key existence and claim support are separate layers; relevance failure is advisory.
        evidence:
          - backend/app/services/executor.py::_apply_citation_hop_exit
          - backend/app/services/citation_relevance.py::escalate_borderline
      - actor: executor finalizer
        component: query-delivery
        does: Persist primary response, costs/results, regulatory coverage gaps, counters, neuron/engram firings, and co-fire learning.
        state_change: Query/telemetry/graph usage history becomes evaluation and learning input.
        guardrail: Only actually included sources receive included-position credit.
        evidence:
          - backend/app/services/executor.py::_finalize_query_results
      - actor: streaming router
        component: query-delivery
        does: Emit bounded SSE stage, result, and error events while the same executor runs in a task.
        state_change: Same as non-streaming path.
        guardrail: Queue is bounded and cancelled if the consumer exits.
        evidence:
          - backend/app/routers/query.py::post_query_stream

  - id: bounded-agent-run
    name: Run a maintenance agent
    availability: active-manual
    trigger: Admin POSTs /v1/agents/{name}/run or a workflow invokes execute_agent
    cadence: On demand; all YAML schedules are currently disabled
    why: Delegate narrow judgment to a model while retaining deterministic tool, mutation, verification, and audit boundaries.
    outcome: A root agent.run Action and child tool Actions provide the authoritative record; proposals or placements may change, never by unrecorded prose.
    through: [bounded-agents, query-delivery, write-governance]
    steps:
      - actor: agent registry
        component: bounded-agents
        does: Load YAML definitions and validate every allowed tool against the ToolRegistry.
        state_change: Process-local immutable agent definitions become available.
        guardrail: Unknown YAML keys or tools fail closed at load time.
        evidence:
          - backend/app/agents/registry.py::AgentRegistry.load
      - actor: agent runtime
        component: bounded-agents
        does: Create root Action, call the configured provider, parse one JSON envelope per turn, and dispatch only allowed tools.
        state_change: Root/child Action rows and tool effects persist.
        guardrail: max_turns hard cap 20, tool timeout 60 seconds, schema validation, allow-list, and bounded done-rejections.
        evidence:
          - backend/app/agents/runtime.py::execute_agent
          - backend/app/agents/runtime.py::_run_turn_loop
      - actor: agent runtime
        component: write-governance
        does: Commit each successful mutating tool immediately and derive final summary from the Action trail rather than the model's self-report.
        state_change: Mutations survive later-turn failure and claims remain auditable.
        guardrail: Profiles can require expected mutation count and a post-mutation verification tool before done.
        evidence:
          - backend/app/services/action_bus.py

  - id: roadmap-ledger-lifecycle
    name: Maintain forward intent and reconcile execution
    availability: active-operator
    trigger: Operator creates/edits/reviews a ledger or a harness requests admission context
    cadence: On planning change and after execution evidence is independently accepted
    why: Keep plans, prerequisites, assumptions, reviews, and verified outcomes durable without confusing retrospective memory with future intent.
    outcome: Canonical JSON state advances under optimistic concurrency; a compact atomic projection feeds hooks; accepted evidence can close records.
    through: [human-console, roadmap-admission]
    steps:
      - actor: Roadmaps UI/API
        component: human-console
        does: Edit sections, records, edges, milestones, assumptions, horizons, cadence, prompts, and verification criteria.
        state_change: A full candidate state is sent with expected_revision.
        guardrail: UI does not bypass backend validation or revision checks.
        evidence:
          - frontend/src/components/RoadmapLedgersPage.tsx
      - actor: ledger service/router
        component: roadmap-admission
        does: Validate IDs/statuses/prerequisites/reviews/assumptions, lock the row, reject stale revisions, advance state version, and commit.
        state_change: roadmap_ledgers.state and revision increment atomically.
        guardrail: Unknown references, invalid status/horizon/cadence, and stale expected_revision fail.
        evidence:
          - backend/app/services/roadmap_ledger.py::validate_state
          - backend/app/routers/roadmap_ledgers.py::update_ledger
      - actor: admission projection
        component: roadmap-admission
        does: Rank a small candidate shortlist and atomically replace owner-only ~/.corvus-mind/planning/ledgers.json.
        state_change: Hooks see the new revision without reading PostgreSQL.
        guardrail: Cache failure never rolls back canonical ledger state.
        evidence:
          - backend/app/services/roadmap_admission.py::refresh_cache
          - backend/app/services/roadmap_admission.py::write_cache
      - actor: independent verifier and owner
        component: roadmap-admission
        does: Attach reconciliation claims, limitations, disclosures, evidence, verifier, and accepting human; close only verified complete work.
        state_change: Record receipt/history update and ledger revision increment.
        guardrail: Verifier cannot equal accepting human; verified completion requires checklist and evidence.
        evidence:
          - backend/app/services/roadmap_ledger.py::reconcile_node

  - id: observability-read
    name: Observe system behavior
    availability: active
    trigger: Operator opens Pallium, Sessions, Skills, Performance, Eval, Labs, or Architecture
    cadence: On demand
    why: Make trust, retrieval, maintenance, cost, latency, skill conversion, benchmark, and structural drift inspectable without changing graph truth.
    outcome: Read models combine PostgreSQL aggregates, episode/manifest/eval artifacts, provider usage probes, and generated source maps.
    through: [human-console, telemetry-evaluation, architecture-observability]
    steps:
      - actor: Observe page
        component: human-console
        does: Fetch a purpose-specific read endpoint through the Vite proxy and render desktop/mobile shell-agnostic views.
        state_change: Browser state only.
        guardrail: Demo builds substitute captured fixtures; normal builds call live endpoints.
        evidence:
          - frontend/src/App.tsx
          - frontend/src/demo/shim.ts
      - actor: metrics/eval services
        component: telemetry-evaluation
        does: Aggregate database rows and local artifacts into trust, channel, sessions, skills, cost, stage latency, immutable run, and experiment reports.
        state_change: Most reads are side-effect free; subscription probes may refresh process-local/cache data only.
        guardrail: Missing optional artifacts return explicit absent/empty states.
        evidence:
          - backend/app/services/mind_metrics.py
          - backend/app/routers/performance.py::performance_report
      - actor: architecture service
        component: architecture-observability
        does: Serve committed extraction/conformance artifacts rather than walking the repository on each page load.
        state_change: None.
        guardrail: Missing or invalid artifacts return explicit 404/500 detail.
        evidence:
          - backend/app/routers/architecture.py::get_architecture

  - id: locomo-benchmark
    name: Run the isolated LoCoMo lifecycle benchmark
    availability: developer-only
    trigger: Explicit eval/locomo harness command
    cadence: On demand for a frozen benchmark or experimental arm
    why: Measure behavior under a known corpus without contaminating the production mind graph.
    outcome: Ingest, answer, maintenance, judge, refusal, and token artifacts are archived under timestamped eval directories and summarized in Observe.
    through: [telemetry-evaluation, recall-graph, memory-ingestion, maintenance-integrity]
    steps:
      - actor: LoCoMo harness
        component: telemetry-evaluation
        does: Select TENANT_ID=corvus-locomo and separate database, reset/seed as required, and run ingest/answer/nospread/baseline/lifecycle phases.
        state_change: Only the benchmark database and eval artifact tree change.
        guardrail: Production corvus_mind rows are not reused.
        evidence:
          - eval/locomo/run_locomo.py::main
      - actor: same memory engine
        component: query-delivery
        does: Run production retrieval, scoring, spread, inhibition, and assembly settings for the selected arm.
        state_change: Benchmark Query/firing rows record the arm.
        guardrail: Arm configuration and corpus receipt are archived.
        evidence:
          - backend/app/services/executor.py::prepare_context
      - actor: lifecycle harness
        component: maintenance-integrity
        does: Invoke production janitor/auditor behavior where the benchmark protocol requires maintenance.
        state_change: Benchmark graph evolves through the same gated lifecycle.
        guardrail: Artifacts record before/after corpus state and errors.
        evidence:
          - backend/app/services/mind_janitors.py::run_janitors
      - actor: judge and analysis
        component: telemetry-evaluation
        does: Score every question, enforce adversarial refusal policy, aggregate categories, and publish latest Oracle Funnel/Locomo status.
        state_change: Immutable result JSON and summary artifacts accumulate.
        guardrail: Complete-run certificates require expected question counts.
        evidence:
          - eval/locomo/run_locomo.py::judge
          - backend/app/services/locomo_run_status.py

  - id: architecture-refresh
    name: Refresh the architecture atlas
    availability: developer-only
    trigger: Code changes or an explicit architecture review
    cadence: Before claiming this page describes the current source
    why: Keep the explanatory model falsifiable against code instead of allowing a hand-drawn diagram to age silently.
    outcome: architecture.json, conformance.json, coverage, drift, routes, runtime, components, and process evidence all reflect one source state.
    through: [architecture-observability]
    steps:
      - actor: Python AST extractor
        component: architecture-observability
        does: Walk every Python module; derive imports, calls, HTTP/MCP routes, DB-write/LLM sites, cycles, and background candidates.
        state_change: architecture/architecture.json is replaced.
        guardrail: Stdlib-only deterministic analysis; parse errors are counted.
        evidence:
          - backend/scripts/extract_architecture.py::build
      - actor: frontend extractor
        component: architecture-observability
        does: Walk TypeScript, resolve direct/API-wrapper URLs, and join normalized frontend callers to backend full paths.
        state_change: Frontend inventory and route join are embedded in architecture.json.
        guardrail: Unresolvable URLs are reported rather than guessed.
        evidence:
          - backend/scripts/extract_frontend.py::build
          - backend/scripts/extract_frontend.py::join_routes
      - actor: conformance checker
        component: architecture-observability
        does: Classify every source unit, check invariants, verify runtime/process evidence, and report unclassified or contradicted claims.
        state_change: architecture/conformance.json is replaced.
        guardrail: Authored explanation and derived facts remain separate artifacts.
        evidence:
          - backend/scripts/check_architecture.py::run

  - id: public-demo-publish
    name: Publish the static public demo
    availability: optional-release
    trigger: Operator runs npm run demo:publish and pushes the exact reviewed state to the demo branch
    cadence: Explicit release only
    why: Demonstrate the interface without exposing private source data, a database, backend endpoints, or provider credentials.
    outcome: Render serves a noindex fixture-backed static bundle; rollback is a prior Render deployment.
    through: [human-console, tests-developer-tools]
    steps:
      - actor: demo capture/check scripts
        component: human-console
        does: Capture approved live endpoint fixtures, validate their contracts, and build with VITE_DEMO=1.
        state_change: Reviewed frontend fixture JSON and static dist change locally.
        guardrail: Publish fails on fixture contract drift; fixtures ship verbatim and require review.
        evidence:
          - frontend/src/demo/shim.ts
          - frontend/package.json
      - actor: Playwright suite
        component: tests-developer-tools
        does: Exercise the demo bundle before branch publication.
        state_change: Test artifacts only.
        guardrail: A failing browser test stops the publish script.
        evidence:
          - frontend/playwright.config.ts
      - actor: Render
        component: human-console
        does: Build the frontend subdirectory from the demo branch and serve dist with SPA fallback.
        state_change: Public static deployment updates.
        guardrail: The Python backend is absent; X-Robots-Tag is noindex,nofollow.
        evidence:
          - frontend/src/demo/shim.ts
