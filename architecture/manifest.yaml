decisions:
  - id: ADR-001
    title: Separate cheap recall from provider-model judgment
    status: accepted-retrospective
    recorded: "2026-07-29"
    context: Recall is latency-sensitive and runs on every prompt/tool boundary; model-bearing judgment is slower, fallible, and provider-dependent.
    decision: Default recall uses local embeddings, PostgreSQL, graph scoring, spread, inhibition, and assembly with no provider LLM; model calls are reserved for bounded workflows.
    consequences:
      - Ambient recall remains low-latency and available when provider CLIs fail.
      - Classification and retrieval quality must be improved through deterministic scoring rather than hidden inference.
    alternatives:
      - Invoke a model on every recall.
      - Use keyword-only retrieval with no semantic or graph stages.
    record: architecture/decisions/ADR-001-cheap-recall.md
    bounded_contexts: [memory-substrate, learning-maintenance]
    evidence:
      - backend/app/services/pipeline/runner.py
      - backend/app/services/llm_provider.py

  - id: ADR-002
    title: Fail open for session continuity and fail closed for durable writes
    status: accepted-retrospective
    recorded: "2026-07-29"
    context: Memory assistance must not strand a coding session, while a bad durable write compounds across every future session.
    decision: Ambient recall/capture failures degrade without blocking the harness; durable mutations require evidence, typed validation, authority routing, and review where applicable.
    consequences:
      - Temporary memory outages reduce assistance rather than halting work.
      - Write paths carry more ceremony, audit state, and human review latency.
    alternatives:
      - Fail closed for every hook.
      - Permit best-effort direct graph writes from agents and model workflows.
    record: architecture/decisions/ADR-002-trust-asymmetry.md
    bounded_contexts: [session-boundary, trust-governance]
    evidence:
      - harness/claude-code/memory_inject_hook.py
      - backend/app/services/write_gate.py

  - id: ADR-003
    title: Keep the operational frontend optional to the memory organ
    status: accepted-retrospective
    recorded: "2026-07-29"
    context: Coding harnesses need memory continuously, while the human console is opened only for observation and judgment.
    decision: Hooks, MCP, timers, API, and PostgreSQL operate independently of the React/Vite frontend; the UI remains a genuine but optional control plane.
    consequences:
      - Frontend failure does not disable recall or capture.
      - Every consequential UI action must have an explicit backend API contract.
    alternatives:
      - Couple memory operation to an open browser session.
      - Remove the human control plane and operate only through scripts.
    record: architecture/decisions/ADR-003-headless-core.md
    bounded_contexts: [session-boundary, operations-observability]
    evidence:
      - frontend/vite.config.ts
      - backend/app/main.py

  - id: ADR-004
    title: Isolate tenants by database and process identity
    status: accepted-retrospective
    recorded: "2026-07-29"
    context: Private developer memory and benchmark corpora must not share mutable graph state or lifecycle side effects.
    decision: TENANT_ID fixes configuration and database identity for a process; corvus-mind and corvus-locomo use separate tenant configs and PostgreSQL databases.
    consequences:
      - Cross-tenant contamination is structurally harder.
      - Operations must verify tenant identity before running scripts, maintenance, or benchmarks.
    alternatives:
      - Shared tables with tenant_id on every row.
      - Separate repositories for each tenant.
    record: architecture/decisions/ADR-004-tenant-isolation.md
    bounded_contexts: [memory-substrate, evaluation-labs]
    evidence:
      - backend/app/tenant.py
      - backend/app/database.py

  - id: ADR-005
    title: Use one typed Action Bus for durable graph mutation
    status: accepted-retrospective
    recorded: "2026-07-29"
    context: Proposals, agents, reconsolidation, maintenance, and explicit saves need consistent validation, audit, idempotency, and reversal semantics.
    decision: Governed writers converge on typed Action Bus handlers and proposal application rather than creating workflow-specific mutation paths.
    consequences:
      - Mutation receipts are attributable and reusable across producers.
      - Direct model construction outside governed handlers becomes visible architectural debt.
    alternatives:
      - Allow each workflow to commit ORM changes directly.
      - Create separate mutation buses for proposals, agents, and janitors.
    record: architecture/decisions/ADR-005-action-bus.md
    bounded_contexts: [trust-governance, memory-substrate]
    evidence:
      - backend/app/services/action_bus.py
      - backend/app/services/actions/init_registry.py

  - id: ADR-006
    title: Project skills and standing capsules from canonical graph state
    status: accepted-retrospective
    recorded: "2026-07-29"
    context: Harnesses need cheap pull-based playbooks and startup policy, but files can drift and lack graph-level provenance.
    decision: Lessons remain canonical in PostgreSQL; compiler/projection services generate SKILL.md files, manifests, charter, and self-model capsules with source-neuron lineage.
    consequences:
      - Skills can be retracted or rebuilt when source lessons change.
      - Projection freshness and write-path isolation require explicit verification.
    alternatives:
      - Hand-author harness skills independently of memory.
      - Inject every lesson into every prompt.
    record: architecture/decisions/ADR-006-canonical-projection.md
    bounded_contexts: [learning-maintenance, session-boundary]
    evidence:
      - backend/app/services/skill_compiler.py
      - backend/app/services/skill_projection.py

  - id: ADR-007
    title: Preserve forward intent in revisioned Roadmap Ledgers
    status: accepted-retrospective
    recorded: "2026-07-29"
    context: Session memory preserves learned facts but is not a safe canonical store for unfinished plans, acceptance criteria, or strategic assumptions.
    decision: Roadmap Ledgers are the canonical forward-intent register; mapped mutations require session admission pinned to the current ledger revision.
    consequences:
      - Agents receive durable kickoff context and cannot silently work against stale intent.
      - Off-ledger work must be explicit, and admissions never imply roadmap completion.
    alternatives:
      - Store plans only in transient agent plans or static markdown.
      - Infer permission from cwd without revision-aware admission.
    record: architecture/decisions/ADR-007-roadmap-ledgers.md
    bounded_contexts: [forward-intent, session-boundary]
    evidence:
      - backend/app/services/roadmap_ledger.py
      - backend/app/services/roadmap_admission.py

  - id: ADR-008
    title: Treat architecture as evidence-linked source-derived state
    status: accepted
    recorded: "2026-07-29"
    context: Hand-maintained diagrams decay as code, routes, deployments, and ownership boundaries change.
    decision: The authored manifest explains intent; deterministic extraction reports source facts; conformance joins them, fingerprints freshness, and drives every Architecture UI view.
    consequences:
      - Contradictions and stale artifacts become visible rather than cosmetically corrected.
      - Static analysis limitations and accepted debt baselines must remain explicit.
    alternatives:
      - Maintain independent diagrams in a drawing tool.
      - Generate architecture solely from imports with no authored intent.
    record: architecture/decisions/ADR-008-living-architecture.md
    bounded_contexts: [operations-observability]
    evidence:
      - backend/scripts/extract_architecture.py
      - backend/scripts/check_architecture.py

  - id: ADR-009
    title: Do not hold database transactions across external model waits
    status: accepted
    recorded: "2026-07-29"
    context: Request-scoped AsyncSessions autobegin on graph reads and otherwise pin a bounded pooled connection while provider subprocesses can wait for minutes.
    decision: Materialize DB inputs, explicitly commit/release the completed phase, run external model work in memory, then open a fresh persistence transaction.
    consequences:
      - Concurrent provider work no longer starves PostgreSQL connection capacity.
      - Query rows become visible only after model and pre-persistence citation work completes.
      - Boundary callers must ensure pending writes are semantically complete because the release commits them.
    alternatives:
      - Increase pool size while retaining request-long transactions.
      - Persist incomplete Query rows before provider execution.
      - Allocate a separate session for every individual stage.
    record: architecture/decisions/ADR-009-no-db-transaction-across-external-io.md
    bounded_contexts: [query-answering]
    evidence:
      - backend/app/database.py::release_connection_before_external_io
      - backend/app/services/executor.py::execute_query
      - backend/tests/test_query_transaction_boundary.py

  - id: ADR-010
    title: Keep high-churn recall state PostgreSQL-canonical across workers
    status: accepted
    recorded: "2026-07-29"
    context: The firing index retained all historical query IDs per process, while adjacency and semantic caches were invalidated only inside the writer process; adding workers therefore multiplied memory and permitted divergent recall.
    decision: Horizontal mode reads firing aggregates and bounded graph frontiers from PostgreSQL, retains only a bounded recent window in the optional single-worker index, and guards the small semantic matrix with a trigger-maintained shared revision.
    consequences:
      - Worker count no longer multiplies firing-history or adjacency memory, and committed graph changes are visible on the next canonical read.
      - Database-backed spread adds bounded SQL frontier reads; the semantic matrix adds one O(1) revision read per use.
      - Every database-backed spread records cap saturation and observed frontier/edge maxima in query telemetry; mind metrics aggregate cap-hit rate over the current recall window.
      - Process-local full adjacency/CSR remains an explicit single-worker latency mode, not a horizontal correctness mode.
      - PostgreSQL advisory locking serializes seed initialization across worker lifespans; schema mutation is an external Alembic deployment step.
    alternatives:
      - Broadcast local invalidations and reload the whole graph after nearly every query.
      - Move every embedding cosine operation into PostgreSQL without a vector index.
      - Accept sticky sessions and eventual cache divergence.
    record: architecture/decisions/ADR-010-horizontal-cache-coherence.md
    bounded_contexts: [memory-substrate]
    evidence:
      - backend/app/services/adjacency_cache.py::get_graph_neighbors
      - backend/app/services/semantic_prefilter.py::_shared_semantic_revision
      - backend/app/services/neuron_index.py::_NeuronIndex.load_aggregates
      - backend/app/services/mind_metrics.py::recall_metrics
      - backend/app/main.py::_canonical_startup_lock
      - backend/tests/test_horizontal_scaling.py

  - id: ADR-011
    title: Make Alembic the sole schema-mutation authority
    status: accepted
    recorded: "2026-07-31"
    context: FastAPI lifespan mixed seeding with runtime DDL, the initial Alembic baseline could not bootstrap a blank database, deployment paths differed, and the live database had no alembic_version table.
    decision: Docker and systemd share one migrate-then-start entry point; FastAPI independently requires the connected database heads to equal the packaged Alembic heads before any seed write.
    consequences:
      - Blank bootstrap, legacy upgrade, and normal deployment use one reviewed migration chain.
      - Unmanaged, behind, ahead, and unreachable schemas fail before application seeding.
      - Destructive migration tests accept only explicitly prefixed disposable database names.
      - Backup/restore verification preserves stable content checksums and extension/vector-index inventory parity.
    alternatives:
      - Continue application-owned idempotent DDL.
      - Stamp databases after out-of-band metadata.create_all.
      - Allow Docker, systemd, and direct Uvicorn starts to enforce different schema contracts.
    record: architecture/decisions/ADR-011-alembic-schema-authority.md
    bounded_contexts: [memory-substrate, operations-observability]
    evidence:
      - backend/scripts/start_backend.sh
      - backend/app/services/schema_authority.py::validate_schema_authority
      - backend/tests/test_migration_smoke.py
      - backend/tests/test_schema_authority.py
      - docs/SCHEMA-RECOVERY.md

  - id: ADR-012
    title: Demote the attribution proxy to triage; trials of absence decide
    status: accepted
    recorded: "2026-08-02"
    context: Delivery plasticity wired distiller verdicts (which see only VISIBLE reliance) to an actuator — a survivor-bias ratchet tightened its own threshold, exculpatory evidence accrued at probe speed while condemnation ran full speed, and "zero false kills" was audited against the proxy's own rewards; prevention-style value is invisible in transcripts.
    decision: The binomial tail only nominates. Attenuation is a controlled trial of absence with exogenous endpoints — probe rewards restore, and token-verified recurrences of a withheld lesson's documented failure restore plus book verified-false-kill receipts. Zero-false-kills is recurrence-grounded, tier-2 retirement requires causal trial evidence, and the contemplated base-rate drift monitor is deliberately not built.
    consequences:
      - A biased nomination wastes a cheap reversible trial instead of farming cobras; the ratchet becomes benign.
      - Withheld logging on Injection records is load-bearing infrastructure — without the denominator the trial is theater.
      - Nothing retires without observed withholding and zero recurrences; the human countersigns an experiment's result, not the distiller's opinion.
      - A missed recurrence is the safe direction — trial continues, exploration floor intact; vague legacy lessons simply enjoy stronger protection.
    alternatives:
      - Keep verdict-driven retirement and bolt on a base-rate drift monitor.
      - Give up on habituation and leave delivery-yield improvement human-driven.
      - Judge recurrences with a second model instead of a deterministic token gate.
    record: architecture/decisions/ADR-012-trial-of-absence.md
    bounded_contexts: [learning-maintenance, trust-governance]
    evidence:
      - backend/app/services/delivery_plasticity.py
      - backend/app/services/recurrence_watch.py
      - harness/claude-code/memory_inject_hook.py
      - backend/tests/test_recurrence_watch.py

