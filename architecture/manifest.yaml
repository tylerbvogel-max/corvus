# Corvus architecture atlas
#
# Authored from a full repository review on 2026-07-29, then checked against
# deterministic Python/TypeScript extraction. The prose explains intent; every
# process step cites code evidence that check_architecture.py verifies exists
# and belongs to the named component.

schema_version: 4

review:
  reviewed_at: "2026-07-30"
  method: >-
    Full source inventory; FastAPI and MCP entry-point review; hook, timer,
    tenant, write-path, query-pipeline, maintenance, agent, reference-ingest,
    roadmap, eval, deployment, and frontend route tracing; deterministic AST
    extraction; frontend/backend URL join; live API and browser verification;
    storage representation, retrieval-lane, scoring, edge-taxonomy, and
    provider-alias audit.
  truth_order:
    - Running-system observations
    - Executable code and deployed service definitions
    - Generated architecture extraction
    - This authored explanation
    - Historical roadmap or design prose
  scope: >-
    The current corvus repository, with corvus-mind as the production tenant
    and corvus-locomo as the isolated benchmark tenant. Historical knowledge-
    tenant and chat/query surfaces still present in executable code are mapped
    and labeled; they are not described as the current product wedge.
  limitations:
    - Static call analysis over-approximates imports and misses dynamic dispatch.
    - A route without a frontend caller may be a deliberate MCP, hook, timer, or external API.
    - Process ordering is code-reviewed and evidence-linked, not inferred from imports alone.
    - Local systemd state is runtime evidence, not guaranteed by repository files.

system_summary:
  identity: >-
    Corvus is a governed developer-memory organ. Coding harnesses capture
    evidence, recall verified memories, and receive standing policy; a FastAPI
    service owns the private graph and trust gates; PostgreSQL holds canonical
    state; filesystem projections deliver capsules, skills, episode logs, and
    admission caches back to harnesses.
  primary_loop: >-
    session work -> redacted episode evidence -> frontier-grade distillation
    through the opus capability alias -> evidence frame -> near-duplicate
    check -> tiered write gate -> audited Action Bus mutation or human
    proposal -> cheap hybrid recall -> measured attribution -> janitor/auditor
    maintenance -> compiled skill and charter projection.
  governing_principle: >-
    Retrieval may fail open, but durable writes fail closed. Authoritative,
    identity-shaping, deduplication, reconsolidation, and reference-promotion
    decisions remain review-gated.
  current_tenants:
    - "corvus-mind — live developer-memory tenant and UI/API on ports 8004/8005"
    - "corvus-locomo — isolated benchmark tenant using the same engine and a separate database"

memory_engine:
  title: Corvus-Mind memory engine
  summary: >-
    The harness captures low-trust evidence outside the backend. The backend
    governs ingestion, executes provider-free hybrid recall, and runs bounded
    maintenance around PostgreSQL canonical state. Process-local matrices and
    filesystem projections are derivatives, never competing sources of truth.
  flow:
    - Harness capture
    - Scheduled distillation
    - Evidence and write governance
    - Hybrid recall and assembly
    - Attribution
    - Maintenance and projection
  zones:
    - id: harness-boundary
      name: Agent and harness boundary
      boundary: client
      purpose: Capture evidence and deliver memory without granting the coding agent direct graph authority.
      details:
        - SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, and Stop hooks drive delivery and capture.
        - PostToolUse and Stop append redacted episode JSONL under the local Corvus memory directory.
        - Thin MCP clients call backend HTTP endpoints; capture itself is not performed inside FastAPI.
        - Retrieved-lane hits pass a habituation pathway gate read from a filesystem projection — suppressed pathways deliver a deterministic 1-in-k probe and log everything else on the Injection record's `withheld` sibling list, keeping the hot path filesystem-only.
      evidence:
        - harness/claude-code/memory_inject_hook.py
        - harness/claude-code/episode_hook.py
        - harness/claude-code/mind_mcp_server.py

    - id: ingest-governance
      name: Ingest and mutation governance
      boundary: backend
      purpose: Convert situated evidence into typed candidates and decide whether any durable mutation is authorized.
      details:
        - A systemd timer offers distillation every 30 minutes; only quiescent undistilled logs run, bounded to five sessions by default.
        - Distillation requests the opus capability grade, which resolves to Codex Sol by default and falls back to Anthropic Opus.
        - Evidence framing, near-duplicate routing, tiered write gates, reviewed proposals, and typed Action Bus handlers fail durable writes closed.
      evidence:
        - harness/systemd/corvus-mind-distill.timer
        - backend/app/services/distiller.py
        - backend/app/services/lesson_store.py
        - backend/app/services/write_gate.py
        - backend/app/services/action_bus.py
        - backend/app/services/llm_provider.py

    - id: recall-engine
      name: Recall and evidence assembly
      boundary: backend
      purpose: Retrieve and assemble relevant evidence cheaply, observably, and without a provider LLM in the default hot path.
      details:
        - Embed-only neighbor voting classifies region and role; deterministic tokenization supplies keywords.
        - Embedding, PostgreSQL full-text, and named-entity lanes contribute candidates and are fused with reciprocal-rank fusion.
        - Six relevance-gated signals combine with a shrinking cold-start prior, region and role boosts, bounded graph spread, inhibition, and token-bounded assembly.
      evidence:
        - backend/app/services/pipeline/stages/classify_stage.py
        - backend/app/services/semantic_prefilter.py
        - backend/app/services/recall_lanes.py
        - backend/app/services/scoring_engine.py
        - backend/app/services/pipeline/stages/spread_stage.py
        - backend/app/services/pipeline/stages/inhibitory_stage.py
        - backend/app/services/pipeline/stages/assemble_stage.py

    - id: maintenance-projection
      name: Maintenance and projection
      boundary: backend
      purpose: Reopen weak or conflicting memory, preserve human judgment, and project trusted graph clusters back into harness capabilities.
      details:
        - Janitors prune firing history, decay utility, inspect staleness, classify delivery, and queue reviewable deduplication or reconsolidation work.
        - Pair and cross-scope judgment request the sonnet capability grade, which resolves to Codex Terra by default; canonical synthesis and the doubt auditor request the opus grade.
        - Deduplication and reconsolidation remain human-gated; successful graph changes refresh skills and standing-policy projections.
        - Delivery plasticity folds episode deliveries, withholdings, attribution verdicts, and verified recurrences into per-pathway habituation state; attenuation is a controlled trial of absence with a probe floor, and retirement is human-countersigned with causal trial evidence.
        - Synaptic downscaling renormalizes every neuron's homeostatic weight by a common factor on the distilled-session clock and lets a fixed floor do the selecting; it targets nothing by name, carries its own axis rather than the evidence scalar, and dormancy silences compiled delivery only, never direct recall.
      evidence:
        - backend/app/services/consolidation.py
        - backend/app/services/mind_janitors.py
        - backend/app/services/reconsolidation/review.py
        - backend/app/services/memory_quality_auditor.py
        - backend/app/services/delivery_plasticity.py
        - backend/app/services/recurrence_watch.py
        - backend/app/services/synaptic_homeostasis.py
        - backend/app/services/skill_compiler.py
        - backend/app/services/llm_provider.py

    - id: canonical-graph
      name: PostgreSQL canonical graph
      boundary: datastore
      purpose: Own the durable tenant-scoped memory, topology, learning history, governance receipts, and provenance.
      details:
        - Neurons carry orthogonal node_type and abstraction_type semantics; parent_id and layer describe navigational projections rather than engine meaning.
        - Embeddings are 384-dimensional JSON arrays stored in TEXT columns; the deployed database does not use pgvector.
        - Stellate and pyramidal are conducting same-region and cross-region edges; evidence-link and supersedes edges carry memory semantics rather than activation.
      evidence:
        - backend/app/models.py
        - backend/app/services/executor.py
        - backend/app/services/consolidation.py

    - id: derived-state
      name: Revision-checked derived state
      boundary: cache
      purpose: Accelerate semantic selection without allowing a worker-local replica to become canonical.
      details:
        - Active neuron and engram embeddings load from PostgreSQL TEXT into a process-local NumPy float32 matrix.
        - PostgreSQL triggers advance a shared cache_versions revision when embeddings or the active set change.
        - Database coherence mode reads firing aggregates and bounded graph frontiers from PostgreSQL; the matrix reloads before semantic use when its revision is stale.
      evidence:
        - backend/app/services/semantic_prefilter.py
        - backend/app/services/neuron_service.py
        - backend/app/services/adjacency_cache.py
        - backend/alembic/versions/024_cache_coherence.py

  truth_notes:
    - id: embedding-storage
      label: Embedding storage
      value: PostgreSQL TEXT containing JSON vectors, searched through a revision-checked NumPy matrix; not pgvector.
      evidence:
        - backend/app/models.py
        - backend/app/services/semantic_prefilter.py
    - id: edge-taxonomy
      label: Edge taxonomy
      value: Stellate and pyramidal conduct activation; evidence-link and supersedes encode memory semantics.
      evidence:
        - backend/app/models.py
        - backend/app/services/consolidation.py
    - id: model-routing
      label: Model routing
      value: Workflows request capability grades; default aliases route opus→Codex Sol and sonnet→Codex Terra with same-grade Anthropic fallback.
      evidence:
        - backend/app/config.py
        - backend/app/services/llm_provider.py
    - id: pathway-habituation
      label: Delivery habituation
      value: Attenuation is a controlled trial of absence, not a verdict — the binomial tail nominates, exogenous evidence (probe rewards, token-verified recurrences of the suppressed lesson's failure) decides, and zero-false-kills is recurrence-grounded so the attribution proxy never grades itself.
      evidence:
        - backend/app/services/delivery_plasticity.py
        - backend/app/services/recurrence_watch.py
    - id: latency
      label: Latency notation
      value: Runtime latency belongs in live metrics with its observation window, not as a timeless constant in the static architecture.
      evidence:
        - backend/app/services/mind_metrics.py
        - backend/app/routers/performance.py

system_context:
  system:
    id: corvus
    name: Corvus
    purpose: Governed long-term memory and forward-intent infrastructure for coding-agent harnesses.
    boundary: Private tenant-scoped graph and control plane; public demo contains fixtures only.
    evidence:
      - backend/app/main.py
      - backend/app/tenant.py
  participants:
    - id: owner-operator
      name: Owner / reviewer
      kind: person
      role: Reviews proposals, steers roadmaps, inspects evidence, and initiates explicit maintenance or evaluation.
      trust: Authenticated human authority; consequential promotions and identity-shaping writes require countersign.
      evidence:
        - frontend/src/App.tsx
        - backend/app/routers/proposals.py
    - id: coding-agent
      name: Coding-agent harness
      kind: external-client
      role: Receives recalled context and standing policy, performs work, emits redacted episode evidence, and invokes memory tools.
      trust: Agent claims are evidence candidates, never self-authenticating durable truth.
      evidence:
        - harness/claude-code/memory_inject_hook.py
        - harness/claude-code/episode_hook.py
    - id: provider-model
      name: User-supplied model provider
      kind: external-compute
      role: Performs bounded judgment for distillation, compilation, critics, document extraction, agents, and optional answering.
      trust: Model output is untrusted input until typed validation, evidence framing, and the applicable write/review gate.
      evidence:
        - backend/app/services/llm_provider.py
    - id: source-authority
      name: Reference and regulatory sources
      kind: external-information
      role: Supply documents, books, uploaded files, and eCFR text with provenance and effective-date semantics.
      trust: Source authority is preserved, but extracted facts enter below lesson authority until human promotion.
      evidence:
        - backend/app/services/reference_ingest.py
        - backend/app/services/ecfr_client.py
    - id: scheduler-host
      name: User systemd scheduler
      kind: external-platform
      role: Offers bounded distill, janitor, auditor, and compiler opportunities on wall-clock cadence.
      trust: May trigger work but cannot bypass evidence-time checks or write governance.
      evidence:
        - harness/systemd/corvus-mind-distill.timer
        - harness/systemd/corvus-mind-janitor.timer
    - id: demo-visitor
      name: Public demo visitor
      kind: person
      role: Explores a fixture-backed static representation of Corvus without reaching private graph state.
      trust: Anonymous public boundary; no private API, database, memory, or provider credential is exposed.
      evidence:
        - frontend/src/demo/shim.ts
        - render.yaml
  relationships:
    - from: owner-operator
      to: corvus
      label: Review, steer, inspect, and invoke control-plane operations
      when: Interactive operation
      data: Review decisions, roadmap intent, documents, agent commands, and read-only observations
    - from: coding-agent
      to: corvus
      label: Recall, remember, capture, and roadmap admission
      when: Harness lifecycle hooks and explicit MCP tools
      data: Queries, evidence frames, redacted tool events, cwd/project context, and attribution receipts
    - from: corvus
      to: coding-agent
      label: Deliver recalled lessons, standing policy, roadmap context, and skill pointers
      when: SessionStart, UserPromptSubmit, PreToolUse, and explicit recall
      data: Provenance-bearing background context and pull-based capability pointers
    - from: corvus
      to: provider-model
      label: Submit bounded reasoning jobs
      when: Only LLM-bearing workflows; never default cheap recall
      data: Redacted/evidence-scoped prompts with explicit output contracts
    - from: source-authority
      to: corvus
      label: Provide source material
      when: Explicit ingest or live regulatory resolution
      data: Documents, metadata, canonical identifiers, citations, and effective dates
    - from: scheduler-host
      to: corvus
      label: Trigger maintenance opportunities
      when: 30m, 6h, 12h, and 24h timer cadences
      data: Authenticated local HTTP batch trigger with no substantive payload
    - from: corvus
      to: demo-visitor
      label: Serve public fixture-backed UI
      when: Demo deployment is explicitly published
      data: Seeded static fixtures and frontend assets only

runtime_nodes:
  - id: coding-harness
    name: Coding-agent harness
    kind: client
    status: active
    when: SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, and Stop
    purpose: Inject memory and policy, capture evidence, expose MCP tools, and enforce roadmap admission.
    technology: Claude Code hooks plus a thin Codex adapter
    evidence:
      - harness/claude-code/memory_inject_hook.py
      - harness/claude-code/episode_hook.py
      - harness/codex/corvus_hook.py

  - id: frontend
    name: Corvus operational console
    kind: interface
    status: active-optional
    when: Opened by an operator; Vite dev server on port 8004
    purpose: Observe memory and operate human control-plane workflows without being required for headless recall.
    technology: React 19, TypeScript, Vite
    evidence:
      - frontend/src/App.tsx
      - frontend/vite.config.ts

  - id: api
    name: Corvus Mind API and remote MCP
    kind: service
    status: active
    when: Long-running systemd service on port 8005
    purpose: Own tenant-scoped graph reads, writes, trust gates, maintenance triggers, metrics, and Streamable HTTP MCP.
    technology: FastAPI, SQLAlchemy async, Uvicorn, FastMCP
    evidence:
      - backend/app/main.py
      - backend/app/mcp_http.py
      - harness/systemd/corvus-mind.service

  - id: postgres
    name: Tenant PostgreSQL graph
    kind: datastore
    status: active
    when: Every graph, proposal, audit, query, roadmap, and metrics operation
    purpose: Canonical private state, isolated by TENANT_ID-derived database name.
    technology: PostgreSQL via asyncpg; JSONB, text-encoded embedding vectors, and expression indexes; no pgvector
    evidence:
      - backend/app/database.py
      - backend/app/models.py

  - id: local-memory-files
    name: Corvus local memory files
    kind: datastore
    status: active
    when: Hook delivery/capture, maintenance ledgers, eval artifacts, and cache projection
    purpose: Fast harness-facing episode logs, attribution receipts, compiled manifest, reports, planning cache, and the delivery-pathway suppression projection the inject hook reads at delivery time.
    technology: JSONL, JSON, atomic file replacement under ~/.corvus-mind
    evidence:
      - harness/claude-code/episode_hook.py
      - backend/app/services/roadmap_admission.py

  - id: projected-skills
    name: Multi-harness skill projections
    kind: artifact
    status: active
    when: Daily compiler run or post-reconsolidation refresh
    purpose: Turn trusted lesson clusters into pull-based playbooks and standing capsules.
    technology: Generated SKILL.md files projected to supported harness directories
    evidence:
      - backend/app/services/skill_compiler.py
      - backend/app/services/skill_projection.py

  - id: provider-cli
    name: Bring-your-own model subprocess
    kind: external-compute
    status: active-bounded
    when: Distillation, compilation, critics, document extraction, agents, or answer generation—not cheap recall
    purpose: Supply reasoning without a server-owned model bill; provider aliases currently prefer Codex with Anthropic fallback.
    technology: Isolated Codex/Claude CLI subprocesses
    evidence:
      - backend/app/services/llm_provider.py

  - id: timers
    name: Evidence-maintenance timers
    kind: scheduler
    status: active
    when: Distill every 30m, janitor every 6h, auditor opportunity every 12h, compile every 24h
    purpose: Offer bounded maintenance opportunities; evidence-time checks decide whether meaningful work occurs.
    technology: systemd user timers calling HTTP batch endpoints
    evidence:
      - harness/systemd/corvus-mind-distill.timer
      - harness/systemd/corvus-mind-janitor.timer
      - harness/systemd/corvus-mind-auditor.timer
      - harness/systemd/corvus-mind-compile.timer

  - id: public-demo
    name: Public seeded demo
    kind: deployment
    status: optional-static
    when: Explicit demo publish to the demo branch
    purpose: Show a fixture-backed UI without shipping the backend, database, private graph, or model access.
    technology: Render static site, Vite demo bundle
    evidence:
      - render.yaml
      - frontend/src/demo/shim.ts

  - id: locomo-lab
    name: LoCoMo evaluation laboratory
    kind: evaluation
    status: developer-only
    when: Explicit benchmark runs
    purpose: Measure retrieval, answer reconstruction, refusal behavior, lifecycle maintenance, and token economics in isolation.
    technology: Python harness, corvus-locomo tenant, corvus_locomo database, immutable eval artifacts
    evidence:
      - eval/locomo/run_locomo.py
      - backend/tenants/corvus-locomo/tenant.yaml

runtime_connections:
  - from: coding-harness
    to: api
    label: HTTP recall/remember/roadmap plus thin stdio MCP
    when: Session hooks and explicit memory tools
  - from: coding-harness
    to: local-memory-files
    label: Append redacted episode and attribution events
    when: PostToolUse, Injection, SkillPointer, Stop, admissions
  - from: api
    to: postgres
    label: Canonical tenant-scoped reads and audited writes
    when: Short read/write phases; query delivery releases the connection before external model waits
  - from: frontend
    to: api
    label: Vite-proxied HTTP control plane
    when: Operator opens or acts in the UI
  - from: timers
    to: api
    label: Bounded POST triggers
    when: Scheduled maintenance opportunities
  - from: api
    to: provider-cli
    label: Isolated reasoning subprocess
    when: Only an LLM-bearing workflow requires it
  - from: api
    to: local-memory-files
    label: Read episodes; write reports, manifests, caches, and ledgers
    when: Distill, compile, janitor, auditor, roadmap projection
  - from: api
    to: projected-skills
    label: Canonical-first generated playbooks and capsules
    when: Compile or reconsolidation refresh
  - from: projected-skills
    to: coding-harness
    label: Push standing capsules; pull task-matched skills
    when: SessionStart or harness skill match
  - from: public-demo
    to: frontend
    label: Fixture-backed build of the same page set
    when: Demo visitor loads static assets
  - from: locomo-lab
    to: api
    label: Same engine under TENANT_ID=corvus-locomo
    when: Benchmark lifecycle run
  - from: locomo-lab
    to: postgres
    label: Isolated corvus_locomo state
    when: Benchmark ingest, recall, answer, judge, maintenance

deployments:
  - id: private-mind
    name: Private Corvus Mind runtime
    status: active
    purpose: Serve the owner and local coding harnesses from a private tenant-scoped memory graph.
    trust_boundary: Local authenticated user boundary; private graph and provider credentials never enter the public demo.
    nodes:
      - coding-harness
      - frontend
      - api
      - postgres
      - local-memory-files
      - projected-skills
      - provider-cli
      - timers
    failure_modes:
      - failure: Frontend or Vite proxy is unavailable.
        visible_as: Operator console cannot load, while hooks, MCP, timers, and direct API remain available.
        recovery: Restart corvus-frontend; no graph repair is required.
      - failure: API process or PostgreSQL is unavailable.
        visible_as: Explicit memory tools and maintenance fail; ambient hook delivery fails open so coding sessions continue.
        recovery: Restart corvus-mind/PostgreSQL, verify /health and tenant identity, then allow caches to preload.
      - failure: Model provider CLI is unavailable or times out.
        visible_as: Distillation, critics, compilation, and optional generation defer or fail; cheap recall continues.
        recovery: Restore the configured provider or fallback alias and rerun the bounded batch.
      - failure: Filesystem projection is stale or unwritable.
        visible_as: Skills, admission cache, reports, or episode capture lag canonical database state.
        recovery: Repair permissions/path, rerun projection or compiler, and reconcile from canonical graph state.
    evidence:
      - harness/systemd/corvus-mind.service
      - frontend/vite.config.ts
      - backend/app/main.py
      - harness/claude-code/memory_inject_hook.py

  - id: isolated-locomo
    name: Isolated LoCoMo benchmark runtime
    status: developer-only
    purpose: Exercise the same memory engine against a frozen benchmark without contaminating the private production graph.
    trust_boundary: Separate TENANT_ID and corvus_locomo database; benchmark judgments and fixtures are not production lessons.
    nodes:
      - locomo-lab
      - api
      - postgres
      - provider-cli
      - local-memory-files
    failure_modes:
      - failure: A run resumes against the wrong tenant or database.
        visible_as: Corpus counts, run certificate, or lifecycle assertions disagree with the frozen fixture.
        recovery: Fail the run, verify TENANT_ID=corvus-locomo and database identity, then restart from an immutable artifact boundary.
      - failure: Provider or judge call fails mid-run.
        visible_as: Run artifact remains incomplete with a resumable checkpoint and model-call log.
        recovery: Restore provider availability and resume the same run rather than mixing a new corpus state.
    evidence:
      - eval/locomo/run_locomo.py
      - backend/tenants/corvus-locomo/tenant.yaml

  - id: public-static-demo
    name: Public static demo
    status: optional
    purpose: Demonstrate Corvus interaction and evidence vocabulary without deploying the private backend.
    trust_boundary: Anonymous internet boundary; static fixtures only, no private database, hooks, memory files, or server model calls.
    nodes:
      - public-demo
      - frontend
    failure_modes:
      - failure: Fixture contract drifts from frontend expectations.
        visible_as: Demo smoke tests or browser flows fail before/after deployment.
        recovery: Recapture reviewed fixtures, run demo contract and Playwright checks, then republish.
      - failure: Render serves an old or failed bundle.
        visible_as: Hosted bundle hash differs from the verified publish artifact.
        recovery: Inspect Render deployment, roll back or republish the verified demo branch.
    evidence:
      - render.yaml
      - frontend/src/demo/shim.ts
      - .github/workflows/demo-smoke.yml

bounded_contexts:
  - id: session-boundary
    name: Harness session boundary
    kind: supporting
    purpose: Translate coding-harness lifecycle events into safe recall, capture, attribution, and admission exchanges.
    ownership: Owns hook semantics, redaction-before-egress, fail-open continuity, and episode transport—not durable graph truth.
    concepts:
      - Session lifecycle trigger
      - Redacted episode event
      - Injection receipt
      - Skill pointer
      - Planning admission
    canonical_state:
      - Episode JSONL and attribution receipts under the local Corvus memory directory
      - Revision-pinned local admission cache
    invariants:
      - Capture must not break the coding session.
      - Secrets and excluded cwd prefixes are filtered before disk or network use.
      - Recalled content is background context, never an executable instruction channel.
    components:
      - harness-transport
      - roadmap-admission
    integrates_with:
      - context: memory-substrate
        contract: HTTP/MCP recall and remember requests carry tenant, query, source, and provenance context.
      - context: learning-maintenance
        contract: Completed episode files become distillation candidates; attribution receipts feed measured reinforcement.
      - context: forward-intent
        contract: Mapped mutations require a current revision-pinned admission receipt.
    evidence:
      - harness/claude-code/memory_inject_hook.py
      - harness/claude-code/episode_hook.py
      - harness/claude-code/roadmap_gate_hook.py

  - id: memory-substrate
    name: Memory substrate
    kind: core
    purpose: Own the tenant-scoped graph, retrieval semantics, activation history, and cheap evidence assembly.
    ownership: Canonical owner of neurons, engrams, edges, firings, score state, source links, and retrieval-stage semantics.
    concepts:
      - Neuron / lesson / tool profile / context scope
      - Engram
      - Synaptic edge and weak edge
      - Firing and attribution
      - Recall lane, score, spread, inhibition, and assembly
    canonical_state:
      - Neuron, NeuronEdge, NeuronFiring, Engram, EngramEdge, and source-link rows in the tenant PostgreSQL database
      - CacheVersion rows provide shared invalidation clocks for low-churn bounded replicas
      - In horizontal mode, firing aggregates and graph frontiers are read from PostgreSQL; only the revision-checked semantic matrix remains process-local
    invariants:
      - Default recall invokes no provider LLM.
      - Canonical scoring reaches inhibitory cooling.
      - Process-local caches are derivatives; PostgreSQL remains canonical.
      - Horizontal workers never require a private full-history or full-adjacency replica for correct recall.
    components:
      - recall-graph
      - platform-infra
    integrates_with:
      - context: trust-governance
        contract: Durable graph mutation enters through typed Action Bus operations or reviewed proposal application.
      - context: learning-maintenance
        contract: Accepted lessons and maintenance actions update the graph, then rebuild affected caches/projections.
      - context: query-answering
        contract: Retrieval returns evidence-bearing context; answer delivery does not own graph truth.
    evidence:
      - backend/app/models.py
      - backend/app/services/pipeline/runner.py
      - backend/app/services/recall_lanes.py

  - id: trust-governance
    name: Trust and mutation governance
    kind: core
    purpose: Decide whether proposed knowledge changes may become durable state and make every mutation attributable and reversible.
    ownership: Owns evidence framing, near-duplicate routing, authority ceilings, proposal review, typed actions, audit receipts, and reversal boundaries.
    concepts:
      - Evidence frame
      - Write-gate verdict
      - Proposal and proposal item
      - Action and audit receipt
      - Authority and delivery mode
    canonical_state:
      - AutopilotProposal, ProposalItem, Action, AuditLog, MemoryChangeEvent, and review metadata
      - Immutable action payloads and created/target neuron linkage
    invariants:
