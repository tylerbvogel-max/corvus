  - id: proposal-review-apply
    name: Review and apply a proposed graph change
    availability: active-operator
    trigger: Human acts in Inbox/Proposal Queue or calls proposal APIs
    cadence: On demand
    why: Separate machine-produced judgment from authority to change durable graph state.
