        component: reference-ingestion
        does: Read the whole document when it fits, otherwise process sections, and create content-only artifact proposals without placement fields.
        state_change: Proposal rows enter artifact state with section/page evidence.
        guardrail: Placement is explicitly out of Phase 1; extraction output is parsed and retried under bounds.
