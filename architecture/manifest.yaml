    through: [human-console, write-governance, maintenance-integrity, skill-projection]
    steps:
      - actor: proposal UI/API
        component: human-console
        does: Present producer origin, items, provenance, dedup/FusionPlan preview, and review controls.
        state_change: None until the reviewer acts.
