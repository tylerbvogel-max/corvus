invariants:
  - id: no-upward-imports
    statement: Service modules should not import router modules; routers are transport adapters, not reusable business logic.
    baseline_count: 0
    check:
      no_import:
        from: backend/app/services/**
        to: backend/app/routers/**

  - id: scoring-must-cool
    statement: The canonical scoring pipeline must include the inhibitory stage so accumulated utility cannot create a rich-get-richer monopoly.
    check:
      must_reach:
        from: backend/app/services/pipeline/stages/__init__.py
        to: backend/app/services/pipeline/stages/inhibitory_stage.py

  - id: neuron-write-paths
    statement: Neuron construction belongs to the governed write component; any direct writer elsewhere is architectural debt.
    check:
      sole_writer:
        box: write-governance
        table: Neuron
        except: [tests-developer-tools, telemetry-evaluation, platform-infra]

  - id: pathway-write-paths
    statement: delivery_pathways rows are written only by the plasticity fold; pathway state is derived signal with an actuating consequence, so it keeps a sole writer even though it lives outside the evidence-gated write paths. This box-level check is the coarse net; architecture/pathway_writers.json plus test_pathway_writers.py pin the exact module with AST honeypots.
    check:
      sole_writer:
        box: delivery-plasticity
        table: DeliveryPathway
        except: [tests-developer-tools, platform-infra]

  - id: trial-before-retirement
    statement: The distiller's attribution verdicts only nominate; no automatic outcome acts on them alone. Suppressed pathways keep a positive delivery floor (probe 1-in-k, never zero), zero-false-kills is computed from token-verified recurrence events rather than reward absence, and a tier-2 retirement proposal is refused unless it carries withheld-trial evidence with zero recurrences. Enforced executably by test_delivery_plasticity.py and test_recurrence_watch.py.
    check: null

  - id: concept-mutations-use-action-bus
    statement: Concept creation and authored instantiation topology must reach the typed Action Bus; only later co-firing adjustments are derived hot-path writes.
    check:
      must_reach:
        from: backend/app/services/concept_service.py
        to: backend/app/services/action_bus.py

  - id: query-executor-releases-db-before-provider
    statement: The main query executor must explicitly end its graph-read transaction before provider slots run.
    check:
      must_reach:
        from: backend/app/services/executor.py
        to: backend/app/database.py

  - id: query-router-releases-db-before-provider
    statement: DB-aware evaluation, refinement, and follow-up routes must reach the shared external-I/O transaction boundary.
    check:
      must_reach:
        from: backend/app/routers/query.py
        to: backend/app/database.py

  - id: chat-title-releases-db-before-provider
    statement: Chat title generation must materialize its session input and release the read transaction before invoking the title model.
    check:
      must_reach:
        from: backend/app/routers/chat_sessions.py
        to: backend/app/database.py

  - id: entailment-releases-db-before-provider
    statement: Optional entailment must release its source-read transaction before invoking the judge model.
    check:
      must_reach:
        from: backend/app/services/entailment_check.py
        to: backend/app/database.py

  - id: horizontal-cache-coherence
    statement: Horizontal recall uses PostgreSQL-canonical firing aggregates and bounded graph frontiers; its only retained graph-derived replica is revision-checked and history-bounded, and canonical startup mutations are serialized across workers.
    check: null

  - id: headless-independence
    statement: Closing the frontend must not stop memory, MCP, hooks, timers, or API operation.
    check:
      no_import:
        from: backend/**
        to: frontend/**

  - id: cheap-recall-no-llm
    statement: Cheap recall may embed locally and query PostgreSQL, but it must never invoke a provider LLM.
    check:
      no_llm:
        box: recall-graph

  - id: reference-authority-wall
    statement: Document-ingested reference facts enter at informational authority and can become lessons only through human-countersigned promotion.
    check: null

  - id: roadmap-revision-pin
    statement: A mapped mutation is allowed only after an admission pinned to the ledger's current revision; revision drift invalidates it.
    check: null

  - id: capture-never-breaks-session
    statement: Capture and ambient recall fail open for session continuity, but redact secrets and honor excluded cwd prefixes before disk or network use.
    check: null

  - id: agent-allow-list
    statement: Agent tools are fail-closed against YAML allow-lists, every loop is turn/time bounded, and mutation claims are derived from Action rows.
    check: null

processes:
  - id: service-startup
    name: Start one tenant runtime
    availability: active
    trigger: Docker or systemd invokes the shared backend startup script; direct Uvicorn is reserved for an intentional schema-guard probe
    cadence: Once per process start
    why: Establish one tenant-isolated API process after the schema has been prepared explicitly by Alembic, then seed state, hot caches, action handlers, and remote MCP.
    outcome: FastAPI and /mcp serve against the TENANT_ID-derived database; the first hot recall avoids lazy cache cost.
    through: [platform-infra, recall-graph, write-governance, harness-transport]
    steps:
      - actor: Docker/systemd startup entry point
        component: platform-infra
        does: Set tenant/bind identity and run alembic upgrade head before executing Uvicorn.
        state_change: The selected tenant database reaches the migration head packaged with this build.
        guardrail: Migration or connectivity failure prevents Uvicorn from starting; Docker and systemd invoke the same script.
        evidence:
          - backend/scripts/start_backend.sh
      - actor: Application factory
        component: runtime-composition
        does: Resolve the tenant's declared capability profile, then mount only that profile's routers and compose only its required startup steps.
        state_change: None; composition is decided before any router module of a disabled capability is imported.
        guardrail: A tenant with a missing, malformed, duplicated, or unrecognized capabilities block fails closed at startup with an actionable error rather than defaulting to mounting everything.
        evidence:
          - backend/app/composition/profiles.py::resolve_profile
          - backend/app/composition/factory.py::create_app
      - actor: FastAPI lifespan schema guard
        component: platform-infra
        does: Read the database's current Alembic heads and require exact equality with the packaged script heads.
        state_change: None; the check is read-only and runs before registries, seeds, or cache warmup.
        guardrail: Unmanaged, behind, ahead, and unreachable databases fail closed with an actionable migration error; the guard is declared unconditional so no capability profile can skip it.
        evidence:
          - backend/app/services/schema_authority.py::validate_schema_authority
      - actor: FastAPI lifespan
        component: runtime-composition
        does: Load the action registry and seed core and engram data — each step only when a granted capability requires it.
        state_change: Bootstrap rows converge to the current code contract without implicit schema mutation; steps required by no granted capability never import their module.
        guardrail: Alembic is the explicit schema authority; no startup step contains a CREATE, ALTER, or metadata.create_all path.
        evidence:
          - backend/app/composition/startup.py
          - backend/app/composition/factory.py::_build_lifespan
      - actor: cache preload
        component: recall-graph
        does: Load the local embedding model, semantic matrix, adjacency list, and CSR view when enabled.
        state_change: Process-local hot caches mirror active graph rows.
        guardrail: preload_on_startup is the explicit rollback switch.
        evidence:
          - backend/app/services/semantic_prefilter.py
          - backend/app/services/adjacency_cache.py
      - actor: FastAPI lifespan
        component: harness-transport
        does: Enter the remote MCP session-manager lifespan and mount Streamable HTTP MCP at /mcp.
        state_change: Remote MCP sessions can be created for the running API worker.
        guardrail: Bare /mcp redirects with 307 so client methods are preserved.
        evidence:
          - backend/app/mcp_http.py::mcp_lifespan

  - id: session-open-delivery
    name: Open a coding session
    availability: active
    trigger: SessionStart hook
    cadence: Once per new or resumed harness session
    why: Put identity, standing policy, and roadmap obligations in the room before the first task while avoiding low-value subjectless recall.
    outcome: The harness receives self-model, charter, and roadmap admission context; no ambient graph recall runs at session open.
    through: [harness-transport, skill-projection, roadmap-admission]
    steps:
      - actor: Codex/Claude hook adapter
        component: harness-transport
        does: Normalize the event and run memory injection plus roadmap context hooks.
        state_change: None in the backend; hook outputs are merged into additionalContext.
        guardrail: Hook exceptions exit zero so a memory outage cannot break the coding session.
        evidence:
          - harness/codex/corvus_hook.py::_normalize
          - harness/codex/corvus_hook.py::main
      - actor: memory injection hook
        component: skill-projection
        does: Read the designated mind-self-model and mind-charter projections from disk; SessionStart graph recall is intentionally disabled.
        state_change: Capsule source neurons are attribution-logged if newly delivered in the session.
        guardrail: Reference-class neurons cannot enter standing identity through the compiler eligibility filters.
        evidence:
          - backend/app/services/skill_compiler.py::compile_charter
      - actor: roadmap hook
        component: roadmap-admission
        does: Resolve cwd against the local ledger cache, log admission-pending, and inject the current revision plus candidate records.
        state_change: PlanningAdmissionPending is appended to the episode timeline.
        guardrail: Cache absence is reported as unavailable, never interpreted as approval.
        evidence:
          - harness/claude-code/roadmap_gate_hook.py::main
          - harness/claude-code/roadmap_admission.py::format_session_context

  - id: prompt-memory-delivery
    name: Recall memory for a user prompt
    availability: active
    trigger: UserPromptSubmit with at least 15 characters
    cadence: Every substantive user prompt
    why: Deliver situated prior experience and relevant playbook pointers before the agent answers or acts.
    outcome: Up to six not-yet-seen one-line memory hooks and not-yet-shown skill pointers are injected and attributed.
    through: [harness-transport, recall-graph, skill-projection]
    steps:
      - actor: memory injection hook
        component: harness-transport
        does: Derive the project from cwd and POST the prompt to /recall with source=hook_user_prompt.
        state_change: None locally until results return.
        guardrail: Excluded cwd prefixes bypass recall and logging; HTTP timeout is 2.5 seconds.
        evidence:
          - harness/claude-code/memory_inject_hook.py::_safe_recall
          - harness/claude-code/memory_inject_hook.py::main
      - actor: recall API
        component: recall-graph
        does: Over-fetch candidates, run the canonical cheap pipeline, drop scaffold node types, apply project boost, and return real knowledge hits.
        state_change: When persist=true, a zero-cost Query row and firing rows record what was actually returned.
        guardrail: top_k is capped; scaffold nodes remain usable for graph spread but cannot consume delivered slots.
        evidence:
          - backend/app/routers/recall.py::recall
          - backend/app/routers/recall.py::_persist_recall
      - actor: graph pipeline
        component: query-delivery
        does: Structural resolve, local embedding classification, hybrid lanes, six-signal score, continuity, spread, inhibition, optional engram resolve, token assembly, and telemetry.
        state_change: No graph mutation during preparation; process-local caches may load.
        guardrail: The canonical ordered stage list includes inhibition and contains no LLM classifier.
        evidence:
          - backend/app/services/executor.py::prepare_context
          - backend/app/services/pipeline/stages/__init__.py
      - actor: skill signpost service
        component: skill-projection
        does: Convert votes from source lessons and scored skill nodes into pull-based playbook pointers.
        state_change: Pointer delivery is logged for later conversion measurement.
        guardrail: A skill node is pointer fuel, never a delivered memory hit.
        evidence:
          - backend/app/services/skill_signpost.py
      - actor: habituation pathway gate
        component: harness-transport
        does: Check each hit's (neuron, trigger, tool) pathway against the plasticity suppression projection; withhold suppressed pathways except the deterministic 1-in-k probe slot hashed from (session, pathway).
        state_change: Probe deliveries are stamped on the Injection record's `probes` list; suppressed hits land on its `withheld` sibling list — the denominator of the trial of absence, logged even when every hit was withheld.
        guardrail: A missing or corrupt projection fails open (deliver); no pathway state may reduce delivery probability to zero, and capsule standing content is never gated here.
        evidence:
          - harness/claude-code/memory_inject_hook.py::_pathway_gate
      - actor: memory injection hook
        component: harness-transport
        does: Dedupe against prior injections/pointers in the episode log and render summaries as background facts, not instructions.
        state_change: Injection and SkillPointer JSONL events link delivered neurons to the recall query id; withheld ids stay out of neuron_ids, dedupe, and attribution.
        guardrail: Full memory bodies are never ambiently injected; detail stays pull-based.
        evidence:
          - harness/claude-code/memory_inject_hook.py::_format_context
          - harness/claude-code/memory_inject_hook.py::_log_injection

  - id: pretool-warning
    name: Warn before a risky shell action
    availability: active
    trigger: PreToolUse for Bash commands with at least 15 characters
    cadence: Before qualifying shell calls
    why: Surface high-confidence machine and tool gotchas at the moment they can prevent a repeated failure.
    outcome: At most two unseen hits scoring at least 1.12 are injected; no skill pointers interrupt the tool call.
    through: [harness-transport, recall-graph]
    steps:
      - actor: memory injection hook
        component: harness-transport
        does: Recall on the first 400 command characters with source=hook_pre_tool and project context, then apply the habituation pathway gate keyed per (neuron, PreToolUse, tool).
        state_change: Successful delivery is appended to the episode log; suppressed hits are logged withheld, probes stamped — same trial ledger as prompt delivery.
        guardrail: Non-Bash tools, short commands, low-score hits, and prior-session duplicates are ignored; the gate fails open.
        evidence:
          - harness/claude-code/memory_inject_hook.py::main
          - harness/claude-code/memory_inject_hook.py::_pathway_gate
      - actor: recall engine
        component: recall-graph
        does: Run the same no-LLM graph path as prompt recall and return scored structured hits.
        state_change: Persist query/firing telemetry for later attribution.
        guardrail: Provider LLM modules are absent from the recall component.
        evidence:
          - backend/app/routers/recall.py::recall

  - id: roadmap-mutation-admission
    name: Admit a mapped project mutation
    availability: active
    trigger: PreToolUse detects a material operation targeting a mapped project
    cadence: Before the first mutation and again after any ledger revision change
    why: Keep coding work bound to canonical forward intent without turning memory retrieval into an enforcement mechanism.
    outcome: The mutation proceeds only with a current bound admission or an explicit off-ledger reason.
    through: [roadmap-admission]
    steps:
      - actor: roadmap gate hook
        component: roadmap-admission
        does: Classify the tool and shell command as material/read-only, resolve target paths to the longest matching project ledger, and inspect the session episode.
        state_change: None on a permitted read; a denial is returned to the harness before the tool executes.
        guardrail: Multi-project mutations are blocked as ambiguous; unknown mutating tools fail toward admission.
        evidence:
          - harness/claude-code/roadmap_admission.py::gate
          - harness/claude-code/roadmap_admission.py::is_material_tool
      - actor: memory MCP client and API
        component: roadmap-admission
        does: Validate unfinished record or off-ledger reason and append a PlanningAdmission event pinned to ledger revision/state version.
        state_change: Append-only admission receipt in the session episode log.
        guardrail: Done, cancelled, or deprioritized records cannot admit bound work.
        evidence:
          - backend/app/services/roadmap_admission.py::admit_session
          - backend/app/routers/roadmap_ledgers.py::create_admission
      - actor: roadmap gate hook
        component: roadmap-admission
        does: Re-read the latest admission; compare its revision to the local projection before allowing mutation.
        state_change: None.
        guardrail: Revision drift blocks and requires readmission.
        evidence:
          - harness/claude-code/roadmap_admission.py::latest_admission
          - harness/claude-code/roadmap_admission.py::gate

  - id: episode-capture
    name: Capture session evidence
    availability: active
    trigger: PostToolUse and Stop hooks
    cadence: After each tool result and at session stop
    why: Preserve deeds and outcomes as low-trust evidence for later distillation without storing full file bodies or secrets.
    outcome: A per-session JSONL episode becomes distill-ready; planning return is recorded when admitted material work occurred.
    through: [harness-transport, roadmap-admission]
    steps:
      - actor: episode hook
        component: harness-transport
        does: Summarize allow-listed tool inputs, derive structural success/failure, redact credential-shaped values, and append one event.
        state_change: ~/.corvus-mind/episodes/{session_id}.jsonl grows by one line.
        guardrail: Excluded cwd prefixes are never logged; arbitrary input fields are dropped; any exception exits zero.
        evidence:
          - harness/claude-code/episode_hook.py::build_record
          - harness/claude-code/episode_hook.py::main
      - actor: episode hook
        component: roadmap-admission
        does: On Stop, inspect post-admission successful material tool events and append PlanningReturn with reconcile-required status.
        state_change: Execution evidence is returned to the episode timeline; canonical roadmap status does not auto-close.
        guardrail: No admission or no material work produces no return receipt.
        evidence:
          - harness/claude-code/roadmap_admission.py::planning_return

  - id: explicit-memory-recall
    name: Explicitly recall institutional memory
    availability: active
    trigger: Agent calls the corvus-mind recall MCP tool
    cadence: On demand
    why: Pull full evidence-framed memory when ambient one-line hooks are insufficient.
    outcome: Structured hits with content, provenance, timestamps, scores, query id, telemetry, and skill pointers.
    through: [harness-transport, recall-graph, query-delivery]
    steps:
      - actor: thin stdio MCP server
        component: harness-transport
        does: POST /recall with include_content=true and source=mcp; it imports no application or database modules.
        state_change: None in the client.
        guardrail: Backend errors are returned as tool JSON instead of crashing the MCP process.
        evidence:
          - harness/claude-code/mind_mcp_server.py::recall
      - actor: recall API and pipeline
        component: recall-graph
        does: Execute cheap hybrid retrieval; in horizontal mode read firing aggregates and bounded spread frontiers from PostgreSQL, checking the shared semantic revision before cosine selection.
        state_change: Query/firing telemetry persists by default; committed graph writes become visible to every worker on its next canonical read or semantic revision check.
        guardrail: Memory-surface dependency 404s the endpoint on non-memory tenants; database spread caps frontier nodes and returned edges per hop.
        evidence:
          - backend/app/routers/recall.py::recall
          - backend/app/services/adjacency_cache.py::get_graph_neighbors
          - backend/app/services/semantic_prefilter.py::ensure_cache_loaded

  - id: explicit-remember
    name: Save one explicit lesson
    availability: active
    trigger: Agent calls remember with claim, evidence, future use, and likely queries
    cadence: On demand after verified learning
    why: Preserve situated knowledge in a form a future agent can reconstruct without this transcript.
    outcome: A novel low-authority lesson is audited and embedded, or a near-duplicate/authoritative write remains queued for review.
    through: [harness-transport, memory-ingestion, write-governance, recall-graph]
    steps:
      - actor: thin MCP client
        component: harness-transport
        does: Send the nine evidence-frame slots to /remember at informational authority.
        state_change: None in the client.
        guardrail: future_use and likely_queries are required tool arguments.
        evidence:
          - harness/claude-code/mind_mcp_server.py::remember
      - actor: remember API and lesson store
        component: memory-ingestion
        does: Resolve a scope/project anchor, normalize entities, build the canonical evidence frame, and stage a proposal item.
        state_change: Proposal and proposal-item rows describe the candidate before any neuron exists.
        guardrail: Missing/malformed frame slots fail with 422; no caller gets an unframed durable memory.
        evidence:
          - backend/app/services/lesson_store.py::save_lesson
          - backend/app/services/evidence_frame.py
      - actor: near-duplicate and write gate
        component: write-governance
        does: Compare nearest active lessons, queue ambiguous duplicates, then classify the proposal by authority, guardrail result, confidence, and region override.
        state_change: Proposal stays proposed or becomes approved/applied by the system gate.
        guardrail: The memory tenant requires approval for dedup; writes above guidance cannot auto-commit.
        evidence:
          - backend/app/services/write_gate.py::route_proposal
      - actor: Action Bus
        component: write-governance
        does: Apply the approved proposal through typed, validated, audited handlers inside a savepoint.
        state_change: Neuron/refinement/action rows change atomically within the outer transaction.
        guardrail: Handler failure rolls back its savepoint and records a failed Action rather than a partial success.
        evidence:
          - backend/app/services/action_bus.py::submit
          - backend/app/services/action_bus.py::_run_handler
      - actor: lesson store
        component: recall-graph
        does: Embed a newly created neuron, wire nearest-neighbor edges, and update the writer's optional local projections before commit returns.
        state_change: PostgreSQL becomes canonical at commit; embedding/active-set triggers advance the shared semantic revision so every worker reloads before its next semantic use.
        guardrail: Cache/index update occurs only after a real created neuron id exists; local updates are optimizations, not cross-worker coherence.
        evidence:
          - backend/app/services/embedding_service.py
          - backend/app/services/semantic_prefilter.py::update_cache_incremental

  - id: episode-distillation
    name: Distill episodes into candidate lessons
    availability: active-scheduled
    trigger: corvus-mind-distill.timer POSTs /distill/run
    cadence: Timer opportunity every 30 minutes; only quiescent undistilled logs run, max five sessions by default
    why: Convert noisy tool evidence and user corrections into durable, future-useful lessons while preventing self-reinforcement and agent-assertion pollution.
    outcome: Gate-passed candidates traverse the same lesson write path; attribution rewards/penalizes previously injected memories; recurrence nominations for withheld lessons pass a deterministic admission gate; successful logs receive markers.
    through: [harness-transport, memory-ingestion, write-governance, delivery-plasticity]
    steps:
      - actor: systemd timer
        component: harness-transport
        does: Offer a bounded POST to /distill/run.
        state_change: Starts one batch request.
        guardrail: Service timeout and per-run session cap bound work.
        evidence:
          - harness/systemd/corvus-mind-distill.service
          - harness/systemd/corvus-mind-distill.timer
      - actor: distiller
        component: memory-ingestion
        does: Load redacted events, injections, user messages, and lowest-trust assistant assertions; request the opus capability grade for framed candidates and attribution verdicts (Codex Sol primary by default, Anthropic Opus fallback).
        state_change: Provider usage is recorded; no candidate is saved yet.
        guardrail: Assistant-origin candidates require a cited corroborating tool event; instruction-shaped and already-injected lessons are dropped.
        evidence:
          - backend/app/services/distiller.py::distill_log
          - backend/app/services/distiller.py::_validate_and_save
      - actor: lesson store and gate
        component: write-governance
        does: Route each surviving candidate through proposal, near-duplicate, authority, and Action Bus controls.
        state_change: Candidate becomes a neuron or remains a review proposal.
        guardrail: One bad candidate is counted and skipped without aborting the session batch.
        evidence:
          - backend/app/services/write_gate.py::route_proposal
      - actor: distiller attribution
        component: memory-ingestion
        does: Reward load-bearing injections, demote contradicted ones, leave unused unchanged, and attach SynapticLearningEvent when query-linked.
        state_change: avg_utility and attribution telemetry move from observed session outcomes.
        guardrail: One verdict per label per session; ambiguous delivery channel is labeled rather than guessed.
        evidence:
          - backend/app/services/distiller.py::_apply_attributions
      - actor: distiller recurrence check (third task)
        component: memory-ingestion
        does: Present lessons a delivery trial withheld from this session and ask whether each one's documented failure actually recurred in the log.
        state_change: None — nominations are model output, not decisions; refused ones are counted and dropped.
        guardrail: Only lessons never delivered anywhere in the session qualify; delivered-and-failed is contradiction evidence for the attribution lane, not trial harm.
        evidence:
          - backend/app/services/distiller.py::distill_log
      - actor: recurrence admission gate
        component: delivery-plasticity
        does: Admit a nomination only when its cited event token-matches both the actual episode events and the withheld lesson's own failure text, then log recurrence.verified per withheld pathway.
        state_change: Ground-truth false-kill evidence lands in the actions log for the plasticity fold to consume.
        guardrail: Uncited or unrelated nominations are refused (deeds-corroborated pattern); a missed match leaves the trial running with the pathway's floor intact — the safe failure direction.
        evidence:
          - backend/app/services/recurrence_watch.py::verify_recurrence
          - backend/app/services/recurrence_watch.py::withheld_for_trial
      - actor: distiller
        component: memory-ingestion
        does: Commit and write a .distilled marker only after the session completes successfully.
        state_change: The log leaves the ready queue; failures without markers retry later.
        guardrail: Per-log failure does not stop other ready logs.
        evidence:
          - backend/app/services/distiller.py::run_distillation

  - id: skill-compilation
    name: Compile lessons into playbooks and standing policy
    availability: active-scheduled
    trigger: corvus-mind-compile.timer POSTs /compile/run
    cadence: Daily opportunity; bounded new skills per run
    why: Convert related trusted memories into reusable procedures while keeping graph truth, projections, and harness delivery synchronized.
    outcome: Stale projections retire to archive; eligible clusters produce mind-* skills and graph-shadow nodes; charter is deterministically rebuilt.
    through: [skill-projection, recall-graph, write-governance]
    steps:
      - actor: skill compiler
        component: skill-projection
        does: Load eligible lessons, build same-scope embedding components, split oversized clusters, and reconcile manifest entries against disk/source health.
        state_change: None until stale or new artifacts are identified.
        guardrail: Source utility, active/superseded state, cluster growth, size caps, and namespacing constrain eligibility.
        evidence:
          - backend/app/services/skill_compiler.py::find_clusters
          - backend/app/services/skill_compiler.py::_stale_entries
      - actor: Frontier-grade composer
        component: skill-projection
        does: Request the opus capability grade to compose one focused name, description, and Markdown playbook from each new eligible cluster; default routing selects Codex Sol with Anthropic Opus fallback.
        state_change: Model usage is added to the compile report.
        guardrail: Invalid JSON, non-mind-* names, or missing fields emit no skill.
        evidence:
          - backend/app/services/skill_compiler.py::_compose
      - actor: canonical projection
        component: skill-projection
        does: Write generated SKILL.md with source-neuron provenance and project it to supported harnesses.
        state_change: Canonical and harness skill files plus compiled-skills manifest change.
        guardrail: Only namespaced generated directories are written; retired renderings are archived, not deleted.
        evidence:
          - backend/app/services/skill_compiler.py::_write_skill
          - backend/app/services/skill_projection.py
      - actor: skill compiler via Action Bus
        component: write-governance
        does: Create an informational skill-shadow neuron and evidence-link edges from its source lessons.
        state_change: The graph can score the skill as pointer fuel and visualize its source cluster.
        guardrail: Recall filters skill nodes from memory hits.
        evidence:
          - backend/app/services/actions/neuron_create.py
      - actor: charter compiler
        component: skill-projection
        does: Deterministically render only guidance/organizational, standing-delivery, non-reference lessons within a character cap.
        state_change: mind-charter projection and manifest entry refresh.
        guardrail: An unclassified corpus cannot blank an existing charter; overflow is logged.
        evidence:
          - backend/app/services/skill_compiler.py::compile_charter

  - id: janitor-cycle
    name: Run bounded memory janitors
    availability: active-scheduled
    trigger: corvus-mind-janitor.timer POSTs /janitor/run
    cadence: Timer opportunity every 6 hours; decay and similar cadence-sensitive work use distilled-session evidence time
    why: Prevent duplicate mass, stale facts, warm zombies, scope drift, stale approvals, and standing-policy drift from accumulating.
    outcome: Safe low-risk metadata changes apply; destructive/synthesis/reference promotion decisions become proposals; delivery pathways habituate/restore with zero-false-kill accounting; reports and change logs remain auditable.
    through: [maintenance-integrity, write-governance, delivery-plasticity, skill-projection]
    steps:
      - actor: janitor orchestrator
        component: maintenance-integrity
        does: Run selected consolidation, staleness, decay, charter promotion, reference promotion, delivery classification, scope lint, and stale-approved passes.
        state_change: Each pass returns a bounded report and persists change events/actions.
        guardrail: Per-pass limits bound mutations and critic volume.
        evidence:
          - backend/app/services/mind_janitors.py::run_janitors
      - actor: consolidation/reconsolidation
        component: maintenance-integrity
        does: Detect similar lesson components, request sonnet-grade pair and cross-scope verdicts (Codex Terra primary by default), and request opus-grade FusionPlan synthesis when rewiring is warranted.
        state_change: Review proposals are queued; silent fusion is disabled on the mind tenant.
        guardrail: Human approval is required for dedup/reconsolidation and stale plans revalidate against live member state.
        evidence:
          - backend/app/services/mind_janitors.py::run_consolidation
          - backend/app/services/reconsolidation/lifecycle.py::revalidate_items
      - actor: staleness and decay passes
        component: maintenance-integrity
        does: Supersede perishable older facts when evidence supports a newer one and demote frequently recalled never-reinforced memories.
        state_change: is_active, superseded_by, avg_utility, edges, findings, and temporal change log may update.
        guardrail: Stable identity facts and organizational standing conflicts are protected; decay runs on new distilled sessions, not wall clock alone.
        evidence:
          - backend/app/services/mind_janitors.py::run_staleness
          - backend/app/services/mind_janitors.py::run_decay_audit
      - actor: promotion/delivery passes
        component: maintenance-integrity
        does: Adjust earned authority, queue reference graduation, and classify whether trusted lessons belong in standing or retrieved delivery.
        state_change: authority/delivery metadata or review proposals change.
        guardrail: Organizational authority is human-set; reference facts cannot auto-enter charter identity.
        evidence:
          - backend/app/services/mind_janitors.py::run_charter_promotion
          - backend/app/services/mind_janitors.py::run_reference_promotion
      - actor: delivery plasticity fold
        component: delivery-plasticity
        does: Run last so it folds this cycle's attribution — episode deliveries, withholdings, verdicts, and verified recurrences become per-pathway counters; attenuate statistically dead pathways in rewarding channels, restore on probe rewards or recurrences (booking verified-false-kill incident receipts), and queue tier-2 retirement proposals carrying the trial as a causal claim.
        state_change: delivery_pathways states, the hot-path suppression projection, and false-kill receipts in the actions log update; the neuron itself is never touched.
        guardrail: Sole writer; binomial tail is triage only; young pathways are immune; no state reaches zero delivery probability; retirement requires an applied human countersign and trial_claim refuses proposals without withheld-trial evidence.
        evidence:
          - backend/app/services/delivery_plasticity.py::run_plasticity
          - backend/app/services/delivery_plasticity.py::decide
          - backend/app/services/delivery_plasticity.py::trial_claim
      - actor: post-reconsolidation projection refresh
        component: skill-projection
        does: Retract skills citing retired sources, deactivate graph shadows, and rebuild the charter when required.
        state_change: Disk projections and manifest no longer cite retired neuron ids.
        guardrail: Projection refresh runs post-commit so files cannot move ahead of a rolled-back graph transaction.
        evidence:
          - backend/app/services/skill_compiler.py::refresh_projections_after_reconsolidation

  - id: pathway-habituation-trial
    name: Run a delivery-pathway trial of absence
    availability: active
    trigger: The plasticity fold attenuates a (neuron, trigger, tool) pathway whose deliveries earn no rewards in a channel that rewards others
    cadence: Continuous once attenuated; one trial spans hook deliveries, distill cycles, and janitor passes until it resolves
    why: Attribution verdicts only see VISIBLE reliance, so unrewarded is not the same as useless — a prevented mistake leaves no transcript trace. Withholding is the only mechanism that can make prevention-value visible; the proxy nominates, the trial decides (mind-delivery-plasticity + mind-recurrence-watch).
    outcome: The pathway either earns restoration — a probe reward, or a verified recurrence of its lesson's documented failure that also books a first-class false-kill incident receipt — or accumulates clean trial evidence toward a human-countersigned retirement that still keeps a probe floor.
    through: [delivery-plasticity, harness-transport, memory-ingestion, write-governance]
    steps:
      - actor: plasticity fold (nomination)
        component: delivery-plasticity
        does: Attenuate when P(0 rewards in n deliveries | channel base reward rate) falls below alpha, with n counted since the last exculpation and immunity for young pathways; project suppression state to the file the hook reads.
        state_change: Pathway state and the suppression projection change; the neuron itself keeps full graph standing and MCP recallability.
        guardrail: The binomial tail is triage, never a verdict — a channel that rewards nobody can never condemn (dead and starved must not look alike), and every transition is audit-logged.
        evidence:
          - backend/app/services/delivery_plasticity.py::decide
          - backend/app/services/delivery_plasticity.py::write_projection
      - actor: hook pathway gate (the experiment)
        component: harness-transport
        does: Withhold the suppressed pathway from most sessions and deliver a deterministic 1-in-k probe on the rest, logging both outcomes on the Injection record.
        state_change: The `withheld` sibling list accumulates the trial's denominator; `probes` marks deliveries that can earn dishabituation.
        guardrail: Fail open on missing projection; withheld ids never enter neuron_ids, session dedupe, or attribution; a trial without logged withholding is not evidence.
        evidence:
          - harness/claude-code/memory_inject_hook.py::_pathway_gate
          - harness/claude-code/memory_inject_hook.py::_log_injection
      - actor: distiller recurrence check
        component: memory-ingestion
        does: On each distill of a session that withheld the lesson, look for its documented failure mode actually recurring in the tool events.
        state_change: Nominations only — the model proposes, it never decides.
        guardrail: Lessons delivered anywhere in the session are excluded; delivered-and-failed routes to the contradiction lane instead.
        evidence:
          - backend/app/services/distiller.py::distill_log
      - actor: recurrence admission and fold actuation
        component: delivery-plasticity
        does: Token-verify each nomination against the episode log AND the lesson's own failure text; on admission the next fold restores the pathway, books a plasticity.false_kill receipt, anchors the exculpation clock so the restore is not undone, and supersedes any pending retirement proposal.
        state_change: Verified false kills surface first-class in the janitor report and the delivery-pathways metrics — computed from recurrence events, never reward absence.
        guardrail: The proxy that nominates never grades its own outcomes; a missed recurrence is the safe direction (trial continues, floor intact). The base-rate drift monitor was deliberately not built — triage-only nomination makes that ratchet benign.
        evidence:
          - backend/app/services/recurrence_watch.py::verify_recurrence
          - backend/app/services/delivery_plasticity.py::run_plasticity
      - actor: tier-2 countersign
        component: write-governance
        does: Review a retirement proposal whose body is a causal claim — sessions withheld with window, probes fired and their outcomes, recurrence count zero — rather than a verdict-shaped statistical argument.
        state_change: Only an APPLIED proposal lets the sole writer retire the pathway; even retired keeps a small probe floor and reopens on new evidence.
        guardrail: Proposals without trial evidence are refused before staging; a rejected proposal blocks re-proposal; a recurrence during retire-proposed supersedes it.
        evidence:
          - backend/app/services/proposal_apply_service.py

  - id: scheduled-doubt-auditor
    name: Reopen risky memories
    availability: active-scheduled
    trigger: 12-hour timer opportunity in auto mode, explicit light/deep run, or event audit of one neuron
    cadence: Evidence clock selects skip/light/deep from fresh distilled sessions
    why: Find subtle defects deterministic janitors cannot see and turn uncertainty into reviewable proposals without granting a critic write power.
    outcome: Ranked risk packets receive bounded opus-grade critiques through provider aliases; valid verdicts may open quality proposals; watermark and precision/volume evidence are logged.
    through: [maintenance-integrity, write-governance]
    steps:
      - actor: deterministic surveillance
        component: maintenance-integrity
        does: Score active lessons from conflict, duplicate, age, utility, provenance, and prior-decision signals; add rotated deep probes and healthy controls.
        state_change: None during scoring.
        guardrail: Candidate, control, probe, and critic counts are hard-capped.
        evidence:
          - backend/app/services/memory_quality_auditor.py::score_neuron
          - backend/app/services/memory_quality_auditor.py::run_audit
      - actor: Frontier-grade critic
        component: maintenance-integrity
        does: Judge evidence packets with prior decisions and source context, then validate the verdict against packet facts.
        state_change: Provider usage and auditor ledger entries record the review.
        guardrail: Invalid or unsupported verdicts are rejected; critic concurrency is capped at two for machine memory safety.
        evidence:
          - backend/app/services/memory_quality_auditor.py::critique_neuron
          - backend/app/services/memory_quality_auditor.py::validate_verdict
      - actor: proposal producer
        component: write-governance
        does: Queue bounded quality proposals for human review instead of editing the neuron.
        state_change: Proposal rows and evidence packets enter the inbox.
        guardrail: Duplicate open hits and heightened-review classes remain gated.
        evidence:
          - backend/app/services/proposal_dedup.py

  - id: reference-document-ingest
    name: Ingest a book into reference memory
    availability: active-operator
    trigger: Operator uploads a supported file to /admin/reference/documents
    cadence: On demand
    why: Add sourced reference knowledge without confusing a document's claims with lived, verified agent experience.
    outcome: Informational Library facts are embedded, linked to a SourceDocument, discounted at cold start, and revocable as a document set.
    through: [reference-ingestion, query-delivery, write-governance, recall-graph]
    steps:
      - actor: reference API
        component: reference-ingestion
        does: Validate size/format, parse text/structure, ensure Library region, supersede prior canonical version, create job, and start a background task.
        state_change: SourceDocument and DocumentIngestJob rows persist before extraction begins.
        guardrail: Authority is fixed at informational; re-ingest revokes the prior active version.
        evidence:
          - backend/app/routers/reference.py::upload_reference_document
      - actor: reference extractor
        component: reference-ingestion
        does: Choose whole-document or section-aware chunks, request the opus capability grade for self-contained faithful facts, and bound total facts.
        state_change: Job progress and provider usage update as chunks complete.
        guardrail: Prompt treats document instructions as data; empty/invalid facts are discarded.
        evidence:
          - backend/app/services/reference_ingest.py::run_reference_ingest
          - backend/app/services/reference_ingest.py::_extract_chunk
      - actor: shared write path
        component: write-governance
        does: Stage each fact as an informational proposal and apply through the same write gate and Action Bus as organic lessons.
        state_change: Reference neurons and Action audit rows are created.
        guardrail: Library region overrides cap authority and discount cold-start prior.
        evidence:
          - backend/app/services/write_gate.py::route_proposal
      - actor: provenance linker
        component: reference-ingestion
        does: Link created neurons to SourceDocument and document anchor, then embed and KNN-wire them.
        state_change: NeuronSourceLink, graph edges, and hot indexes update.
        guardrail: A fact is reported saved only with its provenance link.
        evidence:
          - backend/app/services/reference_ingest.py::save_reference_fact
      - actor: revoke operation
        component: reference-ingestion
        does: Deactivate every still-reference neuron linked to the document, preserve links/change events, retain human-promoted graduates, and invalidate caches.
        state_change: Document status and active neuron set change immediately.
        guardrail: Nothing is deleted; promoted lessons are reported for separate judgment.
        evidence:
          - backend/app/services/reference_ingest.py::revoke_reference_document

  - id: knowledge-document-ingest
    name: Extract and place knowledge-tenant documents
    availability: executable-historical-surface
    trigger: Operator uploads through /admin/documents/upload
    cadence: On demand; hidden from the corvus-mind memory-surface navigation
    why: Preserve the two-phase document pipeline still used by knowledge-graph deployments and historical Corvus surfaces.
    outcome: Frontier-grade extraction artifacts are placed one-by-one by the neuron_placer agent, then enter the normal human proposal queue.
    through: [reference-ingestion, bounded-agents, write-governance]
