name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, scan, and verify without creating a GitHub release
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # The release path runs the SAME gate as merge. It used to run its own
  # `pytest tests/ -q` directly, which bypassed the deterministic lane contract
  # in backend/scripts/run_test_lane.py: no marker selection, no per-lane
  # timeout, no artifact capture, and no architecture, migration, frontend, or
  # supply-chain component at all. A tag could therefore be cut on evidence
  # strictly weaker than what any pull request had to clear.
  gate:
    uses: ./.github/workflows/required-merge-gate.yml

  build:
    needs: gate
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_DATE_EPOCH: '0'
      DOCKER_BUILDKIT: '1'
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-reference: ${{ steps.publish.outputs.reference }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install uv pip-audit cyclonedx-bom

      - name: Build the release artifact
        id: build
        env:
          # A fixed epoch keeps timestamp-derived layer content stable between
          # builds of the same commit.
          SOURCE_DATE_EPOCH: '0'
          DOCKER_BUILDKIT: '1'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker build \
            --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            --build-arg CORVUS_REVISION="$GITHUB_SHA" \
            --build-arg CORVUS_VERSION="$VERSION" \
            --build-arg CORVUS_BUILD_ID="$GITHUB_RUN_ID" \
            -t "corvus-mind:$GITHUB_SHA" .
          echo "digest=$(docker image inspect --format '{{.Id}}' corvus-mind:$GITHUB_SHA)" >> "$GITHUB_OUTPUT"

      # Scans run on source AND on the built artifact. The artifact check is the
      # one that catches baked credentials and unreachable provider paths, which
      # source scanning cannot see.
      - name: Secret scan (source)
        run: python backend/scripts/supply_chain.py secrets
      - name: Dependency vulnerability audit
        run: python backend/scripts/supply_chain.py audit
      - name: Artifact scan (built image)
        run: python backend/scripts/supply_chain.py artifact "corvus-mind:$GITHUB_SHA"

      # Distribute the image that was scanned. A source tag plus a digest of
      # an image discarded with the runner is not a deployable release.
      - name: Publish the scanned image
        id: publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "corvus-mind:$GITHUB_SHA" "$IMAGE"
          docker push "$IMAGE"
          REFERENCE=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          test -n "$REFERENCE"
          echo "RELEASE_IMAGE=$REFERENCE" >> "$GITHUB_ENV"
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"

      - name: SBOM and provenance
        run: |
          python backend/scripts/supply_chain.py sbom
          python backend/scripts/supply_chain.py provenance --image "$RELEASE_IMAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: release-supply-chain
          path: .artifacts/supply-chain/
          retention-days: 90

      - name: Record pull command
        run: echo "Deploy the scanned image with docker pull $RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corvus_test_release
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Pull and start the published image on a fresh runner
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGE: ${{ needs.build.outputs.image-reference }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$RELEASE_IMAGE"
          docker run -d --name corvus-release-proof --network host \
            -e DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/corvus_test_release \
            -e CORVUS_BIND_HOST=127.0.0.1 "$RELEASE_IMAGE"
          for attempt in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8005/ready; then exit 0; fi
            sleep 2
          done
          docker logs corvus-release-proof
          exit 1
      - name: Verify deployed image identity and behavior
        env:
          EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image-digest }}
        run: |
          mkdir -p .artifacts/release
          python3 backend/scripts/verify_deployment.py \
            --container corvus-release-proof --expect-source-revision "$GITHUB_SHA" \
            --expect-image-id "$EXPECTED_IMAGE_ID" --frontend --packaged-atlas --recall-query memory \
            --json > .artifacts/release/deployment.json
      - name: Capture runtime logs
        if: always()
        run: |
          mkdir -p .artifacts/release
          docker logs corvus-release-proof > .artifacts/release/container.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-deployment
          path: .artifacts/release/
          retention-days: 90

  release:
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-supply-chain
          path: .artifacts/supply-chain/
      - uses: actions/download-artifact@v4
        with:
          name: release-deployment
          path: .artifacts/release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            install.sh
            config.example.json
            .artifacts/supply-chain/sbom.cdx.json
            .artifacts/supply-chain/provenance.json
            .artifacts/release/deployment.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# RETIRED: publish-pypi
#
# This workflow previously carried a `publish-pypi` job gated on
#   if: github.repository == 'tylerbvogel/corvus'
# and a `Build MCP server package` step that wrote mind_mcp_server_entry.py into
# the runner and then never referenced it again.
#
# Both are retired rather than silently deleted, with the evidence that retired
# them (measured 2026-08-01):
#
#   * The only configured remote is `private` ->
#     https://github.com/tylerbvogel-max/corvus.git. `github.repository` can
#     therefore never equal 'tylerbvogel/corvus', so the job has never run once.
#     It was not a working publisher that needed fixing; it was dead code that
#     read as coverage.
#   * The package it would have published was assembled from a pyproject
#     heredoc inlined in this file, declaring unpinned `mcp>=1.26.0` and
#     `httpx>=0.28` — the opposite of the lock-driven contract this record
#     establishes for everything else.
#   * Current product direction is a hosted graph with a user-supplied brain,
#     not a PyPI-distributed MCP shim.
#
# To revive it: add a real packaging manifest under harness/claude-code/ (not a
# heredoc), give it its own lock, correct the condition to
# 'tylerbvogel-max/corvus', and add a publish gate that requires the artifact
# scan above to pass. See docs/SUPPLY-CHAIN.md, "Retired publishing paths".
# ─────────────────────────────────────────────────────────────────────────────
