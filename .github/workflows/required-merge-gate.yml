name: required-merge-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Callable so the release path runs the SAME gate as merge, rather than a
  # second, weaker copy of it. See .github/workflows/release.yml.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: required-merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML
      - name: Check architecture evidence, fitness, and source freshness
        shell: bash
        run: |
          mkdir -p .artifacts
          set -o pipefail
          python backend/scripts/check_architecture.py --strict 2>&1 | tee .artifacts/architecture-conformance.log
      - name: Require committed conformance artifact
        shell: bash
        run: |
          set -o pipefail
          git diff --exit-code -- architecture/conformance.json 2>&1 | tee -a .artifacts/architecture-conformance.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: architecture-conformance-failure
          path: .artifacts/
          retention-days: 14

  backend-deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/run_test_lane.py required-backend
      # Every tenant, each in a clean interpreter. The hermetic lane can only
      # check the one tenant it imported, and cannot prove a module was never
      # imported from inside a process that imported it.
      - name: Verify per-tenant runtime composition snapshots
        run: python scripts/capability_snapshot.py --check
      # Maintenance jobs are systemd timers curling the app's own routes, so a
      # composed-away capability can strand a timer firing into a 404. The
      # in-repo units make that checkable; installed-unit reconciliation is
      # skipped where systemd is unavailable.
      - name: Reconcile scheduled job ownership against capability profiles
        run: python scripts/capability_snapshot.py --jobs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-deterministic-failure
          path: .artifacts/test-lanes/
          retention-days: 14

  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corvus_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d corvus_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CORVUS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/corvus_test_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/run_test_lane.py database
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: migration-smoke-failure
          path: .artifacts/test-lanes/
          retention-days: 14

  frontend-type-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        shell: bash
        run: |
          mkdir -p ../.artifacts
          set -o pipefail
          npm run build 2>&1 | tee ../.artifacts/frontend-type-build.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-type-build-failure
          path: .artifacts/
          retention-days: 14

  # Browser evidence, reusing demo-smoke.yml rather than copying its steps.
  frontend-browser-smoke:
    uses: ./.github/workflows/demo-smoke.yml

  # Added alongside the existing components; the four test lanes in
  # backend/scripts/run_test_lane.py are untouched by this job.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install supply-chain tooling
        run: pip install uv pip-audit cyclonedx-bom
      # The lock is only an authority if it provably still describes
      # pyproject.toml. Without this, a dependency added to pyproject would
      # install in dev and vanish from the artifact.
      - name: Dependency lock is current
        run: python backend/scripts/lock_dependencies.py --check
      - name: Secret scan (source)
        run: python backend/scripts/supply_chain.py secrets
      - name: Dependency vulnerability audit
        run: python backend/scripts/supply_chain.py audit
      - name: Generate SBOM
        run: python backend/scripts/supply_chain.py sbom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain
          path: .artifacts/supply-chain/
          retention-days: 14

  required-merge-gate:
    if: always()
    needs:
      - architecture-conformance
      - backend-deterministic
      - migration-smoke
      - frontend-type-build
      - frontend-browser-smoke
      - supply-chain
    runs-on: ubuntu-latest
    steps:
      # Count-independent by design. This was an equality test against the
      # literal string "success,success,success,success", which meant every
      # branch that added a gate component had to edit this one line — so two
      # branches adding a component each would conflict here by construction.
      # Asserting "nothing is non-success" instead scales without edits.
      - name: Require every gate component
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "component results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "no gate components reported a result" >&2
            exit 1
          fi
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*|*,skipped,*)
              echo "a required gate component did not succeed" >&2
              exit 1
              ;;
          esac
          echo "every gate component succeeded"
