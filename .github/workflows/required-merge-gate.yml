name: required-merge-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML
      - name: Check architecture evidence, fitness, and source freshness
        shell: bash
        run: |
          mkdir -p .artifacts
          set -o pipefail
          python backend/scripts/check_architecture.py --strict 2>&1 | tee .artifacts/architecture-conformance.log
      - name: Require committed conformance artifact
        shell: bash
        run: |
          set -o pipefail
          git diff --exit-code -- architecture/conformance.json 2>&1 | tee -a .artifacts/architecture-conformance.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: architecture-conformance-failure
          path: .artifacts/
          retention-days: 14

  backend-deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/run_test_lane.py required-backend
      # Every tenant, each in a clean interpreter. The hermetic lane can only
      # check the one tenant it imported, and cannot prove a module was never
      # imported from inside a process that imported it.
      - name: Verify per-tenant runtime composition snapshots
        run: python scripts/capability_snapshot.py --check
      # Maintenance jobs are systemd timers curling the app's own routes, so a
      # composed-away capability can strand a timer firing into a 404. The
      # in-repo units make that checkable; installed-unit reconciliation is
      # skipped where systemd is unavailable.
      - name: Reconcile scheduled job ownership against capability profiles
        run: python scripts/capability_snapshot.py --jobs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-deterministic-failure
          path: .artifacts/test-lanes/
          retention-days: 14

  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corvus_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d corvus_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CORVUS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/corvus_test_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/run_test_lane.py database
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: migration-smoke-failure
          path: .artifacts/test-lanes/
          retention-days: 14

  frontend-type-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Contract drift gate. The generated types and capability table are
      # derived from backend/tests/contracts/openapi.*.json — the same
      # artifacts capability_snapshot.py --check guards on the backend side.
      # Together the two make drift a merge failure in both directions: the
      # backend cannot change its surface without updating the snapshot, and
      # the frontend cannot fall behind the snapshot without failing here.
      - name: Generated API contracts are current
        shell: bash
        run: |
          mkdir -p ../.artifacts
          set -o pipefail
          npm run check:contracts 2>&1 | tee ../.artifacts/frontend-contracts.log
      - name: Type-check and build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../.artifacts/frontend-type-build.log
      # Runs against the build above rather than rebuilding: it reads
      # dist/.vite/manifest.json, so the "initial route" is the entry's real
      # static import graph, not a filename pattern. Budgets and their
      # justifications are committed in frontend/bundle-budget.json; raising
      # one is a reviewable diff, which is the whole point.
      - name: Bundle budget
        shell: bash
        run: |
          set -o pipefail
          npm run check:bundle 2>&1 | tee ../.artifacts/frontend-bundle-budget.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-type-build-failure
          path: .artifacts/
          retention-days: 14

  required-merge-gate:
    if: always()
    needs:
      - architecture-conformance
      - backend-deterministic
      - migration-smoke
      - frontend-type-build
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate component
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = "success,success,success,success"
