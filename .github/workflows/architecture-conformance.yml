name: architecture-conformance

on:
  pull_request:
    paths:
      - 'architecture/**'
      - 'backend/**/*.py'
      - 'frontend/src/**/*.ts'
      - 'frontend/src/**/*.tsx'
      - 'harness/**'
      - 'eval/**'
      - '.github/workflows/architecture-conformance.yml'
  push:
    branches: [main]
    paths:
      - 'architecture/**'
      - 'backend/**/*.py'
      - 'frontend/src/**/*.ts'
      - 'frontend/src/**/*.tsx'
      - 'harness/**'
      - 'eval/**'
      - '.github/workflows/architecture-conformance.yml'
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML
      - name: Check architecture evidence, fitness, and source freshness
        run: python backend/scripts/check_architecture.py --strict
      - name: Require committed conformance artifact
        run: git diff --exit-code -- architecture/conformance.json
