name: heavy-test-lanes

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      run_live_provider:
        description: Run the real provider smoke
        required: true
        type: boolean
        default: false
      live_provider_model:
        description: MODEL_REGISTRY key for the live smoke
        required: false
        default: groq-llama-70b

permissions:
  contents: read

jobs:
  slow-evaluation-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/run_test_lane.py evaluation
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: slow-evaluation-failure
          path: .artifacts/test-lanes/
          retention-days: 14

  live-provider:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_provider
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CORVUS_RUN_LIVE_PROVIDER: '1'
      CORVUS_LIVE_PROVIDER_MODEL: ${{ inputs.live_provider_model }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Require an explicitly configured provider credential
        shell: bash
        run: |
          if [[ -z "$GROQ_API_KEY" && -z "$ANTHROPIC_API_KEY" && -z "$OPENAI_API_KEY" ]]; then
            echo "No live-provider credential is configured" >&2
            exit 2
          fi
      - run: python scripts/run_test_lane.py live-provider
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-provider-failure
          path: .artifacts/test-lanes/
          retention-days: 14
